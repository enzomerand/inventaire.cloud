        content:
          application/json:
            schema:
              properties:
                mapping:
                  items:
                    properties:
                      column:
                        description: "L'`index` d'une colonne."
                      field:
                        description: "L'identifiant du champ. Obligatoire pour la cible `field`."
                      type:
                        description: 'Le type du nouveau champ. Obligatoire pour la cible `new`.'
                      name:
                        description: 'Le nom du nouveau champ. Obligatoire pour la cible `new`.'
                decimal:
                  description: "Conservé depuis l'import s'il n'est pas envoyé."
                date_order:
                  description: "Conservé depuis l'import s'il n'est pas envoyé."
                on_error:
                  description: "Conservé depuis l'import s'il n'est pas envoyé."
      responses:
        202:
          description: "L'import, `pending`."
        403:
          description: "Le jeton n'a pas la permission `write`, ou l'utilisateur est lecteur de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `write`."
        404:
          description: "Cette ressource n'existe pas, ou elle appartient à un espace de travail dont le propriétaire du jeton n'est pas membre (les deux cas ne sont pas distingués)."
          x-codes:
            -
              description: "Le délai de l'import est écoulé et son fichier a disparu. Envoyez de nouveau le fichier."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "L'import a déjà été lancé."
            -
              description: "Les nouveaux champs feraient dépasser à l'inventaire le nombre de champs qu'il peut avoir. `limit` indique combien."
        422:
          description: "Le corps ou la chaîne de requête est refusé. `errors` nomme chaque erreur sous la clé qu'elle concerne."
          x-codes:
            -
              description: "Le fichier n'a pas cette colonne (sur `mapping`, avec `column`)."
            -
              description: 'Une colonne est indiquée deux fois (avec `column`).'
            -
              description: "Le champ n'existe pas dans cet inventaire (avec `column`)."
            -
              description: 'Le champ se renseigne en téléversant des fichiers (avec `column` et `field`).'
            -
              description: 'Deux colonnes vont vers le même champ (avec `column` et `field`).'
            -
              description: 'Un champ de ce type ne peut pas être créé par un import (avec `column`).'
            -
              description: "Le nom d'un nouveau champ est vide, trop long ou sur plusieurs lignes (avec `column`)."
            -
              description: 'Deux nouveaux champs ont le même nom (avec `column`).'
            -
              description: "L'inventaire a déjà un champ portant ce nom (avec `column`)."
            -
              description: "L'utilisateur n'a pas le droit de créer des champs, ou le jeton n'a pas `manage`, que demande la création d'un champ (avec `column`)."
            -
              description: "Un champ obligatoire n'a pas de colonne (avec `field`)."
            -
              description: "Aucune colonne n'est associée à un champ."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
