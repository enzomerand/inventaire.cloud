        403:
          description: "Le jeton n'a pas la permission `write`, ou l'utilisateur est lecteur de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `write`."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "L'article contient déjà le nombre maximal de fichiers autorisé. `limit` indique combien."
            -
              description: 'Le champ contient déjà autant de fichiers que son `max_files`. `limit` indique combien.'
            -
              description: "Les fichiers de l'espace de travail pèseraient plus que ce qui est autorisé. `limit` est en octets."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: "La limite de débit du jeton, ou celle des téléversements par minute de l'utilisateur, est atteinte."
  '/inventories/{inventory}/items/{item}/attachments/{attachment}':
    get:
      summary: 'Télécharger un fichier'
      description: "Le fichier en téléchargement. Avec `inline=1`, une image (JPEG, PNG, WebP, GIF) ou un PDF est affiché dans la page à la place. L'`ETag` est l'identifiant du fichier : renvoyez-le dans `If-None-Match` pour obtenir une `304`."
      parameters:
        -
          description: 'Valeur `1` pour afficher une image ou un PDF au lieu de le télécharger. Ignoré pour les autres types.'
      responses:
        200:
          description: 'Le contenu du fichier, avec le type détecté lors du téléversement.'
          headers:
            Content-Disposition:
              description: '`attachment` (ou `inline`) avec le nom du fichier.'
            Content-Length:
              description: 'Octets.'
            ETag:
              description: "L'identifiant du fichier, entre guillemets."
            Cache-Control:
              description: 'Toujours `private, no-cache`.'
