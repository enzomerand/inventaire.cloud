  '/inventories/{inventory}/items':
    get:
      summary: "Lister les articles d'un inventaire"
      description: |-
        Une page de 50 articles, les plus récents d'abord sauf si `sort` indique autre chose.

        - `q` garde les articles qui contiennent tous les mots, quelles que soient la casse et les accents.
        - `filter[<field id>][<operator>]` garde les articles qui remplissent toutes les conditions. `empty` (`true` ou `false`) fonctionne
          sur tous les champs. Un champ nombre, note ou date accepte `min` et `max` (tous deux inclus, écrits comme la
          valeur est stockée), un champ oui / non `is`, un champ choix unique ou multiple `in` (identifiants de choix, l'un d'eux
          suffit : `filter[<field id>][in][]=<choice id>`). Le texte et les mots clés se recherchent avec `q`, ils ne se filtrent pas.
        - `sort` vaut `created_at`, `updated_at` ou l'identifiant d'un champ, avec `direction`. Les articles sans valeur viennent en dernier.
          Les champs choix multiple, mots clés, fichier et photo ne peuvent pas être triés. La nature de chaque champ est dans `query_kind`.
        - `totals[]` additionne les champs nombre et montant sur **tous** les articles qui correspondent, pas seulement sur la page. C'est
          facultatif parce que cela coûte un parcours des valeurs : sans lui, `meta.totals` est absent.

        La chaîne de requête est vérifiée dans son ensemble : chaque erreur est signalée d'un coup dans une `422`, sous des clés telles que `sort`,
        `direction`, `filter.<field id>.<operator>` et `totals.<position>`.
      parameters:
        - []
        -
          description: 'Les mots à rechercher. 200 caractères au plus ; des espaces seuls ne constituent pas une recherche.'
        -
          description: "Ce sur quoi trier. Sans lui, l'article le plus récent vient en premier et `direction` ne change rien."
        -
          description: 'Le sens du tri, sans distinction de casse.'
        -
          description: "Conditions sur les champs : `filter[<field id>][<operator>]=<value>`, par exemple `filter[01k8…][min]=10` ou `filter[01k8…][empty]=false`. Les opérateurs qu'un champ accepte dépendent de son `query_kind`."
          schema:
            additionalProperties:
              properties:
                empty:
                  description: 'Indique si le champ ne contient aucune valeur. Toutes les natures de champ.'
                min:
                  description: 'Plus petite valeur, incluse. Natures `number` et `temporal`.'
                max:
                  description: 'Plus grande valeur, incluse. Natures `number` et `temporal`.'
                is:
                  description: 'Le oui ou le non à trouver. Nature `boolean`.'
                in:
                  description: "Identifiants de choix, l'un quelconque suffit. Natures `choice` et `choices`."
        -
          description: "Les identifiants des champs nombre et montant à additionner : `totals[]=<field id>`, répété pour chaque champ. Un champ qui n'existe pas ou qui ne peut pas être additionné donne une `422` sur `totals.<position>`."
      responses:
        200:
          description: "Une page d'articles."
          content:
            application/json:
              schema:
                properties:
                  meta:
                    allOf:
                      - []
                      -
                        properties:
                          limits:
                            description: "Les limites des pièces jointes, pour qu'un client puisse vérifier un fichier avant de l'envoyer."
                            properties:
                              attachment_size:
                                description: 'Le plus gros fichier, en octets (20 Mo par défaut).'
                              attachments_per_item:
                                description: "Le nombre maximal de fichiers qu'un article peut contenir (20 par défaut)."
                          totals:
                            description: 'La somme de chaque champ demandé dans `totals[]`, sur tous les articles correspondants, indexée par l''identifiant du champ, sous forme de chaînes décimales. Zéro (`"0.00"`) quand aucun article n''a de valeur.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
    post:
      summary: 'Ajouter un article'
      description: "Ajoute un article. Réservé aux éditeurs et aux propriétaires. `values` est indexé par l'identifiant du champ. Une clé qui n'est pas un champ de l'inventaire, une valeur que le champ refuse et un champ obligatoire sans valeur donnent des `422` sur `values.<field id>` ; toutes les erreurs sont signalées d'un coup. Un champ `file` ou `photo` se renseigne en téléversant des fichiers, pas en envoyant des valeurs. Un inventaire contient 10000 articles par défaut."
      responses:
        201:
          description: "L'article qui a été créé."
        403:
          description: "Le jeton n'a pas la permission `write`, ou l'utilisateur est lecteur de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `write`."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "L'inventaire contient déjà le nombre maximal d'articles autorisé. `limit` indique combien."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
  '/inventories/{inventory}/items/{item}':
    get:
      summary: 'Obtenir un article'
      responses:
