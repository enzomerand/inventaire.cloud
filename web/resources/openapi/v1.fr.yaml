  '/inventories/{inventory}/imports/{import}/start':
    post:
      summary: 'Lancer un import'
      description: "Indique où va chaque colonne et lance l'import : un worker convertit, vérifie et ajoute les lignes en une seule transaction, et crée les nouveaux champs. `mapping` comporte une entrée par colonne à utiliser ; une colonne omise est ignorée. Un champ obligatoire de l'inventaire doit être associé à une colonne. Créer des champs (`target: new`) demande le droit de modifier les champs (éditeurs et propriétaires) et, pour un jeton, la permission `manage` en plus de `write` : avec `write` seul, le mapping ne peut viser que des champs existants (`cannot_manage_fields` sinon). La réponse est l'import, `pending` ; interrogez-le. Un inventaire contient 10000 articles par défaut et un fichier 10000 lignes."
