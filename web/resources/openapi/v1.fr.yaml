          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
    post:
      summary: 'Demander un export'
      description: |-
        Met en file d'attente la génération d'un fichier des articles. Tout membre de l'espace de travail peut exporter, lecteurs compris. La réponse est l'export, `pending` ; interrogez `GET /inventories/{inventory}/exports/{export}` jusqu'à ce que son `status` soit `completed` (ou `failed`), puis téléchargez-le. Le fichier est conservé 24 heures par défaut.
        Un PDF contient 500 articles au plus par défaut (`pdf_too_large`). Un zip a besoin d'au moins un fichier à y mettre (`zip_without_files`). Un utilisateur peut avoir 10 exports d'un inventaire à la fois, et l'ensemble de ses exports pèse 2 Go au plus par défaut.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                scope:
                  description: 'Avec `view`, les articles que sélectionne `query` ; `query` est refusé avec `all`.'
                query:
                  description: "La vue à exporter, pour la portée `view`. Les mêmes paramètres que la liste des articles, sous forme d'objet JSON."
                  properties:
                    direction:
                      description: '`asc` ou `desc`.'
                    filter:
                      description: 'Par identifiant de champ, puis par opérateur : `{"<field id>": {"min": "10"}}`. Voir la liste des articles pour les opérateurs.'
                delimiter:
                  description: '`csv` uniquement. Le séparateur, qui fixe aussi le signe décimal (une virgule avec le point-virgule, un point avec les autres). Par défaut, un point-virgule quand la langue de la requête est le français, sinon une virgule.'
                files:
                  description: '`zip` uniquement. `photos` (par défaut) ou `all` (tous les fichiers des articles).'
      responses:
        202:
          description: "L'export, `pending`."
        403:
          description: "Le jeton n'a pas la permission `write`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `write`."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "L'utilisateur a déjà le nombre maximal d'exports de cet inventaire autorisé. `limit` indique combien."
            -
              description: 'Ses exports, celui-ci compris, pèseraient plus que ce qui est autorisé. `limit` est en octets.'
        422:
          description: "Le corps ou la chaîne de requête est refusé. `errors` nomme chaque erreur sous la clé qu'elle concerne."
          x-codes:
            -
              description: "Un PDF ne peut pas contenir autant d'articles (sur `format`). `limit` indique combien il peut en contenir."
            -
              description: "Aucun des articles n'a de fichier à mettre dans le zip (sur `format`)."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: "La limite de débit du jeton, ou celle des exports par minute de l'utilisateur, est atteinte."
