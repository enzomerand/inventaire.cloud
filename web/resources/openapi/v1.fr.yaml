    x-displayName: 'Modèles'
    description: "Le catalogue public des modèles d'inventaire. Aucun jeton requis."
paths:
  /me:
    get:
      summary: "Obtenir l'utilisateur du jeton"
      description: "À qui appartient le jeton. Pratique pour vérifier qu'un jeton fonctionne."
      responses:
        200:
          description: "L'utilisateur."
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
  /field-types:
    get:
      summary: 'Lister les types de champ'
      description: "Tous les types qu'un champ peut avoir, dans l'ordre où l'application web les propose. `type` est le mot à envoyer pour ajouter un champ."
      responses:
        200:
          description: 'Les types.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
  /workspaces:
    get:
      summary: 'Lister les espaces de travail'
      description: "Tous les espaces de travail auxquels appartient le propriétaire du jeton, l'adhésion la plus ancienne en premier, avec son rôle dans chacun."
      responses:
        200:
          description: 'Les espaces de travail.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
    post:
      summary: 'Créer un espace de travail'
      description: "Crée un espace de travail dont l'utilisateur est propriétaire. Tout le monde peut le faire, dans la limite du nombre d'espaces de travail auxquels un compte peut appartenir (50 par défaut) et d'un rythme de 20 créations par heure par défaut."
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 'Le nom. Les espaces autour sont supprimés.'
      responses:
        201:
          description: "L'espace de travail qui a été créé."
        403:
          description: "Le jeton n'a pas la permission `manage`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `manage`."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "Le compte appartient déjà au nombre maximal d'espaces de travail autorisé. `limit` indique combien."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: "La limite de débit du jeton, ou celle des créations par heure de l'utilisateur, est atteinte."
  '/workspaces/{workspace}':
    patch:
      summary: 'Renommer un espace de travail'
      description: 'Réservé aux propriétaires.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 'Le nouveau nom. Les espaces autour sont supprimés.'
      responses:
        200:
          description: "L'espace de travail."
        403:
          description: "Le jeton n'a pas la permission `manage`, ou l'utilisateur n'est pas propriétaire de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `manage`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
    delete:
      summary: 'Supprimer un espace de travail'
      description: "Supprime l'espace de travail et tout ce qu'il contient : inventaires, articles, fichiers. Réservé aux propriétaires. Le dernier espace de travail d'un utilisateur ne peut pas être supprimé. Si c'était celui dans lequel l'utilisateur travaillait, un autre prend sa place."
      responses:
        204:
          description: "L'espace de travail est supprimé."
        403:
          description: "Le jeton n'a pas la permission `manage`, ou l'utilisateur n'est pas propriétaire de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `manage`."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "C'est le dernier espace de travail de l'utilisateur. Créez-en d'abord un autre."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
  '/workspaces/{workspace}/members':
    get:
      summary: "Lister les membres d'un espace de travail"
      description: "Tous les membres de l'espace de travail, le propriétaire en premier, puis dans l'ordre où ils ont rejoint l'espace. N'importe quel membre peut le demander. L'`email` d'un membre n'est donné qu'au propriétaire de l'espace de travail et à ce membre, et vaut `null` pour tous les autres (la clé est toujours présente). `id` désigne le membre dans cet espace de travail ; ce n'est pas le numéro de son compte et il ne signifie rien dans un autre espace de travail."
      responses:
        200:
          description: 'Les membres.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
  '/workspaces/{workspace}/members/{member}':
    patch:
      summary: "Modifier le rôle d'un membre"
      description: "Fait d'un membre un `editor` ou un `viewer`. Réservé aux propriétaires. Le rôle du propriétaire ne peut pas être modifié : transférez la propriété avec `POST /workspaces/{workspace}/transfer`."
      responses:
        200:
          description: 'Le membre, avec son nouveau rôle.'
        403:
          description: "Le jeton n'a pas la permission `manage`, ou l'utilisateur n'est pas propriétaire de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `manage`."
            -
              description: "L'utilisateur appartient à l'espace de travail sans en être propriétaire : seul son propriétaire décide de qui en fait partie."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: 'Le membre est le propriétaire, dont le rôle ne peut pas être modifié. Transférez plutôt la propriété.'
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
    delete:
      summary: "Retirer un membre d'un espace de travail, ou le quitter"
      description: "Retire un membre : il perd l'accès à l'espace de travail aussitôt. Les propriétaires peuvent retirer n'importe quel membre sauf eux-mêmes. Un membre peut se retirer lui-même, ce qui revient à quitter l'espace de travail ; une personne dont c'était le dernier espace de travail en reçoit un personnel. Le propriétaire ne peut pas le quitter : il doit d'abord transférer la propriété."
      responses:
        204:
          description: "Le membre n'est plus dans l'espace de travail."
        403:
          description: "Le jeton n'a pas la permission `manage`, ou l'utilisateur retire quelqu'un d'autre sans être propriétaire de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `manage`."
            -
              description: "L'utilisateur appartient à l'espace de travail sans en être propriétaire, et retire quelqu'un d'autre : seul son propriétaire retire des membres."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "Le membre est le propriétaire, qui ne peut pas être retiré. Transférez d'abord la propriété."
            -
              description: "L'utilisateur est le propriétaire et se retire lui-même : le propriétaire ne peut pas quitter l'espace de travail. Il doit d'abord transférer la propriété."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
  '/workspaces/{workspace}/transfer':
    post:
      summary: "Transférer la propriété d'un espace de travail"
      description: "Fait d'un membre le propriétaire de l'espace de travail, et de l'utilisateur, qui doit en être le propriétaire, un éditeur ; les deux changements ont lieu ensemble. `user_id` est l'`id` du membre, tel que le donne `GET /workspaces/{workspace}/members`. Un espace de travail a toujours un seul propriétaire."
      requestBody:
        content:
          application/json:
            schema:
              properties:
                user_id:
                  description: "L'`id` du membre qui devient propriétaire."
      responses:
        200:
          description: "L'espace de travail tel que l'utilisateur le voit désormais, avec son nouveau rôle."
        403:
          description: "Le jeton n'a pas la permission `manage`, ou l'utilisateur n'est pas propriétaire de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `manage`."
            -
              description: "L'utilisateur appartient à l'espace de travail sans en être propriétaire : seul son propriétaire décide de qui en fait partie."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: 'Le membre est déjà le propriétaire.'
        422:
          description: "Le corps est refusé, ou `user_id` n'est pas un membre de l'espace de travail. `errors` nomme chaque erreur sous la clé qu'elle concerne."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
  '/workspaces/{workspace}/invitations':
    get:
      summary: 'Lister les invitations envoyées par un espace de travail'
      description: "Les invitations de l'espace de travail qui attendent une réponse, de la plus récente à la plus ancienne. Réservé aux propriétaires. Une invitation expirée n'est pas listée."
      responses:
        200:
          description: 'Les invitations.'
        403:
          description: "Le jeton n'a pas la permission `read`, ou l'utilisateur n'est pas propriétaire de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
            -
              description: "L'utilisateur appartient à l'espace de travail sans en être propriétaire : seul son propriétaire décide de qui en fait partie."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
    post:
      summary: 'Inviter une adresse dans un espace de travail'
      description: |-
        Invite une adresse dans l'espace de travail, comme `editor` ou `viewer`, et lui envoie un e-mail. Réservé aux propriétaires. L'invitation est liée à l'adresse, pas à un lien : la personne se connecte avec cette adresse, trouve l'invitation parmi les siennes (`GET /me/invitations`) et l'accepte ou la refuse ; tant que les inscriptions sont fermées, une invitation en attente permet aussi à son adresse de s'inscrire. L'e-mail part après la réponse, dans la langue du compte de cette adresse s'il y en a un, sinon dans celle de la requête. L'invitation expire au bout de 14 jours par défaut ; la renvoyer lui donne un nouveau délai.
        Un espace de travail compte 50 membres et invitations en attente ensemble par défaut (`member_limit_reached`), et un propriétaire peut envoyer 20 e-mails par heure par défaut, invitations et invitations renvoyées ensemble (`429` au-delà, avec `Retry-After`).
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  description: "L'adresse à inviter. Elle est mise en minuscules, et un domaine avec des accents est converti."
      responses:
        201:
          description: "L'invitation qui a été créée."
        403:
          description: "Le jeton n'a pas la permission `manage`, ou l'utilisateur n'est pas propriétaire de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `manage`."
            -
              description: "L'utilisateur appartient à l'espace de travail sans en être propriétaire : seul son propriétaire décide de qui en fait partie."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "L'adresse appartient déjà à un membre de l'espace de travail, propriétaire compris."
            -
              description: 'Une invitation à cette adresse attend déjà une réponse. Renvoyez-la, ou retirez-la, plutôt.'
            -
              description: "L'espace de travail contient déjà le nombre maximal de membres et d'invitations en attente autorisé. `limit` indique combien."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: "La limite de débit du jeton, ou celle des invitations par heure de l'utilisateur, est atteinte."
  '/workspaces/{workspace}/invitations/{invitation}':
    delete:
      summary: 'Retirer une invitation'
