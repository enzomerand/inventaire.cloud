  '/inventories/{inventory}/exports':
    get:
      summary: "Lister vos exports d'un inventaire"
      description: "Les exports du propriétaire du jeton pour cet inventaire qui n'ont pas expiré, du plus récent au plus ancien, 20 au plus. Un export n'appartient qu'à son auteur : personne d'autre ne le voit, quel que soit son rôle."
      responses:
        200:
          description: 'Les exports.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
