  '/inventories/{inventory}/items/{item}/attachments':
    post:
      summary: 'Téléverser un fichier sur un article'
      description: "Joint la partie `file` à l'article. Avec `field` (l'identifiant d'un champ `file` ou `photo` de l'inventaire), le fichier renseigne ce champ et son identifiant est ajouté à la valeur du champ ; sans lui, le fichier est une simple pièce jointe. Le type du fichier est détecté d'après son contenu. Un champ `photo` n'accepte que des images JPEG, PNG, WebP et GIF. Un fichier pèse 20 Mo au plus par défaut (`meta.limits` de la liste des articles l'indique), un article contient 20 fichiers par défaut, un espace de travail 1 Go de fichiers par défaut, et un utilisateur téléverse 30 fichiers par minute par défaut. Réservé aux éditeurs et aux propriétaires."
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: 'Le fichier.'
                field:
                  description: "L'identifiant du champ `file` ou `photo` que le fichier renseigne."
      responses:
