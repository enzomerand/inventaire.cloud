# French text of the API reference (/docs/api): an overlay of v1.yaml, nothing else.
#
# It repeats the tree of v1.yaml and holds only its summary, description and title strings, translated; everything that is
# not text (paths, schemas, examples, enums, defaults) stays in v1.yaml, and /api/v1/openapi.json stays in English. A list keeps
# the positions of v1.yaml, and an empty list stands for an item that has no text. Code spans, Markdown headings and link
# targets must be the same as in v1.yaml.
#
# tests/Feature/Docs/OpenApiTranslationTest.php checks it against v1.yaml: change a text there, change it here.
info:
  title: 'API inventaire.cloud'
  summary: "L'API JSON publique d'inventaire.cloud."
  description: |
    L'API publique d'inventaire.cloud : espaces de travail, leurs membres et invitations, inventaires, champs, articles et leurs fichiers, exports, imports et versions officielles.
    La plupart de ce que l'application web fait avec vos données peut se faire ici, avec un jeton d'accès personnel.

    ## Authentification

    Créez un jeton d'accès personnel depuis la page Compte de l'application web (carte « Jetons d'API ») : choisissez un nom,
    les permissions qu'il porte et une expiration (7, 30, 90 ou 365 jours, ou jamais). La valeur commence par `inv_` et n'est
    affichée qu'une seule fois, à la création du jeton : copiez-la à ce moment-là. Envoyez-la avec chaque requête :

        Authorization: Bearer inv_…

    Un jeton absent, mal formé, expiré ou révoqué reçoit la réponse `401`. Se déconnecter partout depuis la page Compte
    révoque tous les jetons du compte. La connexion, le compte lui-même, l'administration et la gestion des jetons
    relèvent de l'application web et ne font pas partie de cette API : ils refusent une requête faite avec un jeton (`403`,
    `session_required`).

    Envoyez le jeton seul. Une requête qui porte aussi le cookie de session de l'application web reçoit la réponse `403`
    avec le code `token_with_session`, quelles que soient les permissions du jeton : avec les deux, on ne saurait pas lequel des deux décide.

    ## Permissions

    Un jeton porte une ou plusieurs permissions, et chaque opération de ce document indique celle dont elle a besoin dans `x-ability` :

    - `read` : toutes les opérations `GET` ;
    - `write` : le contenu d'un inventaire, c'est-à-dire les articles, les pièces jointes, les exports, les imports et les versions officielles (création, modification, suppression) ;
    - `manage` : la structure, c'est-à-dire les espaces de travail, les inventaires et les champs (création, modification, suppression), et les personnes d'un espace de travail, c'est-à-dire ses membres,
      leurs rôles, sa propriété et ses invitations.

    Les permissions sont indépendantes : `write` et `manage` n'incluent pas `read`. Un jeton qui ne peut pas lire est difficilement
    utilisable, puisque les identifiants dont les autres opérations ont besoin se trouvent avec `GET` : donnez `read` en plus
    des autres. Ce que répond une opération `write` est la ressource qu'elle a écrite (l'article, la pièce jointe, l'export,
    l'import ou la version), donc `write` voit ce qu'il écrit. `manage` peut supprimer un espace de travail ou un inventaire
    avec toutes les données qu'il contient : ne le donnez qu'à ce qui en a besoin. Une requête faite avec un jeton qui n'a pas
    la permission requise reçoit la réponse `403` avec le code `token_ability_missing`.

    Un jeton ne dépasse jamais son propriétaire. Quelles que soient ses permissions, il ne peut faire que ce que le propriétaire a le
    droit de faire dans chaque espace de travail, selon son rôle : `owner`, `editor` ou `viewer`. Une ressource d'un espace de
    travail auquel le propriétaire n'appartient pas reçoit la réponse `404`, comme si elle n'existait pas ; un membre dont le
    rôle n'autorise pas l'opération reçoit la réponse `403` (sans `code`, sauf quand seul le propriétaire de l'espace de travail le peut, comme pour ses membres et ses invitations : `not_owner`).

    ## Limites de débit

    Chaque jeton peut faire 120 requêtes par minute par défaut (l'administrateur de l'instance peut modifier cette valeur).
    Toute requête faite avec un jeton compte, y compris celles qui sont refusées. Au-delà de la limite, la réponse est `429`
    avec le code `too_many_requests` et un en-tête `Retry-After`, le nombre de secondes à attendre.

    Certaines opérations ont leur propre limite, plus stricte, comptée par utilisateur : créer un espace de travail, téléverser
    un fichier, demander un export, envoyer ou relire un fichier à importer, figer un inventaire en version officielle, envoyer une invitation à un espace de travail (ou la renvoyer). Une requête
    refusée avant d'en arriver là (un jeton sans la permission requise, par exemple) ne la consomme pas. Au-delà, la réponse est aussi
    `429`, avec `Retry-After`. Le catalogue public de modèles a sa propre limite, par adresse réseau.

    Les réponses portent `X-RateLimit-Limit` et `X-RateLimit-Remaining`. Quand plusieurs limites s'appliquent à une requête (celle
    du jeton et celle de l'opération), les en-têtes décrivent celle qui a le moins de requêtes restantes : pour un export, ce sont
    ceux de la limite d'export dès qu'elle est plus proche que celle du jeton. Sur une `429`, ce sont ceux de la limite dépassée,
    avec `Retry-After`.

    ## Erreurs

    Une erreur a toujours un corps JSON, quel que soit l'en-tête `Accept` :

    - `{"message": "…"}` pour `401`, `403` et `404` ; le message s'adresse aux humains et peut changer. `403` porte un `code` quand une
      raison lisible par une machine existe (`token_ability_missing`, `token_with_session`, `session_required`, `not_owner`), `404` en porte un pour les rares cas qui
      ne sont pas un simple « introuvable » ;
    - `{"message": "…", "code": "…"}` pour `409`, `429` et `503`, où `code` est la raison à tester dans votre code. Une `409` qui
      vient d'un quota porte aussi une `limit`, le nombre qui a été franchi ;
    - `{"message": "…", "errors": {"<field>": ["…"]}}` pour `422`, avec les clés du corps de la requête (`values.<field id>`,
      `options.max`, `query.filter.<field id>.min`…) ; quelques refus ajoutent un `code` et les éléments qui l'expliquent.

    Chaque réponse d'erreur d'une opération liste, dans `x-codes`, les valeurs de `code` qu'elle peut porter.

    ## Identifiants et dates

    Les ressources sont identifiées par des ULID en minuscules (26 caractères, chiffres et lettres), dans les chemins et dans les
    corps. Les clés numériques de la base de données ne sont jamais exposées ; la seule exception est l'`id` du compte dans `GET /me`. Un membre d'un espace de travail est désigné par un identifiant de même forme, valable dans cet espace de travail seulement.
    Les dates sont au format ISO 8601 en UTC (`2026-10-15T12:30:00+00:00`).

    ## Articles et leurs valeurs

    Les `values` d'un article forment un objet JSON indexé par l'identifiant du champ. Un champ qui ne contient aucune valeur est
    absent. Le type JSON dépend du type du champ (`GET /field-types`) : texte, texte long, URL, e-mail, téléphone, couleur,
    code-barres, date (`YYYY-MM-DD`), date et heure (UTC, `2026-10-15T12:30:00Z`), heure (`HH:MM`) et choix unique (l'identifiant du
    choix) sont des chaînes ; nombre, montant et pourcentage sont des **chaînes décimales** (`"12.50"`, jamais un nombre JSON, afin que
    rien ne soit perdu) ; oui / non est un booléen ; note est un entier ; choix multiple et mots clés sont des tableaux de chaînes ; fichier
    et photo sont des tableaux d'identifiants de pièces jointes, écrits en téléversant des fichiers, jamais en envoyant des valeurs.

    Pour écrire, envoyez les mêmes formes (les nombres peuvent aussi être envoyés comme nombres JSON, mais envoyez-les sous forme de texte
    lorsqu'ils ont beaucoup de chiffres). Envoyer `null`, un texte vide ou une liste vide pour un champ l'efface.

    ## Pagination

    Les listes qui peuvent être longues sont paginées avec le paramètre de requête `page` (1 par défaut) : 50 articles, 25 révisions ou 20 versions par
    page. La réponse est `{"data": […], "links": {"first", "last", "prev", "next"}, "meta": {"current_page", "last_page",
    "per_page", "total", "from", "to", "path", "links"}}` ; les liens des pages conservent vos autres paramètres de requête.
    Les autres listes (espaces de travail, membres, invitations, inventaires, types de champ, modèles) sont renvoyées d'un seul bloc, dans `data` ; les listes d'exports
    et d'imports contiennent les 20 plus récents.

    ## Langue

    Les messages et les libellés (le nom d'un type de champ, l'erreur d'un export échoué) sont dans la langue de l'en-tête
    `Accept-Language` (`fr` ou `en`) ; la langue par défaut de l'instance s'applique en son absence. Les identifiants, les codes et les données
    que vous avez enregistrées ne sont jamais traduits.
servers:
  -
    description: "Cette instance. Les chemins ci-dessous sont relatifs à celle-ci."
tags:
  -
    x-displayName: 'Compte'
    description: "L'utilisateur auquel appartient un jeton."
  -
    x-displayName: 'Types de champ'
    description: 'Les types que peut avoir un champ, avec leurs noms dans la langue de la requête.'
  -
    x-displayName: 'Espaces de travail'
    description: "Les espaces de travail auxquels appartient l'utilisateur, avec son rôle dans chacun."
  -
    x-displayName: 'Membres'
    description: "Les personnes qui appartiennent à un espace de travail, avec leur rôle, et la propriété de l'espace de travail."
  -
    x-displayName: 'Invitations'
    description: 'Les invitations à rejoindre un espace de travail, envoyées par son propriétaire et auxquelles répond la personne concernée.'
  -
    x-displayName: 'Inventaires'
    description: "Les inventaires d'un espace de travail, avec leurs champs et ce que l'utilisateur peut en faire."
  -
    x-displayName: 'Champs'
    description: "Les colonnes typées d'un inventaire (ajouter, modifier, ordonner, supprimer)."
  -
    x-displayName: 'Articles'
    description: "Les lignes d'un inventaire, avec tri, filtres, recherche et totaux."
  -
    x-displayName: 'Historique'
    description: "L'historique d'un article, de la modification la plus récente à la plus ancienne."
  -
    x-displayName: 'Pièces jointes'
    description: "Fichiers joints à un article, ou renseignant l'un de ses champs de type fichier ou photo."
  -
    x-displayName: 'Exports'
    description: "Fichiers des articles d'un inventaire (XLSX, ODS, CSV, JSON, PDF, zip), générés en arrière-plan."
