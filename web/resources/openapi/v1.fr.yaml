  '/inventories/{inventory}/versions':
    get:
      summary: "Lister les versions officielles d'un inventaire"
      description: "Les versions officielles de l'inventaire, de la plus récente à la plus ancienne, 20 par page. Une version appartient à l'inventaire, pas à la personne qui l'a figée : tout membre de l'espace de travail voit toutes les versions."
      responses:
        200:
          description: 'Une page de versions.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
    post:
      summary: "Figer l'inventaire en version officielle"
      description: |-
        Fige l'inventaire en sa prochaine version officielle, numérotée 1, 2, 3... Réservé aux éditeurs et aux propriétaires. L'état de l'inventaire à ce moment est écrit dans un fichier JSON canonique (`snapshot`, avec son SHA-256) pendant que l'inventaire est verrouillé en écriture, ce qui prend une ou deux secondes pour des milliers d'articles ; un PDF est ensuite généré en arrière-plan à partir de ce fichier. La réponse est la version, `pending` : interrogez `GET /inventories/{inventory}/versions/{version}` jusqu'à ce que son `status` soit `completed` (ou `failed`), puis téléchargez les fichiers.
        `signers` demande au service de signature de l'instance (Documenso) de faire signer le PDF par chaque personne : il ajoute une page de signatures au PDF et envoie un e-mail à chaque signataire. L'instance doit en avoir un (`signature_unavailable`). Les personnes sont fixées pour la version : pour en solliciter d'autres, figez de nouveau l'inventaire.
        Un inventaire contient 200 versions par défaut (`version_limit_reached`), un utilisateur peut figer 10 fois par heure par défaut, un PDF contient 500 articles au plus par défaut (`pdf_too_large`) et les fichiers d'une version comptent dans le stockage de l'espace de travail (`storage_limit_reached`). Un espace de travail peut demander des signatures 20 fois par jour par défaut, une version figée avec des signataires ou une demande échouée renvoyée comptant pour une (`429` au-delà, avec `Retry-After`).
      requestBody:
        content:
          application/json:
            schema:
              properties:
                label:
                  description: 'Le nom que vous donnez à la version, sur une seule ligne. Aucun quand il est absent, null ou vide.'
                signers:
                  description: "Les personnes dont demander la signature, 10 au plus (l'administrateur de l'instance peut abaisser cette limite). Leurs e-mails doivent être différents. Absent pour une version que personne n'a à signer."
      responses:
        202:
          description: 'La version, `pending`.'
        403:
          description: "Le jeton n'a pas la permission `write`, ou l'utilisateur est lecteur de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `write`."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "L'inventaire contient déjà le nombre maximal de versions autorisé. `limit` indique combien."
            -
              description: "Les fichiers de l'espace de travail pèsent déjà autant que ce qui est autorisé. `limit` est en octets."
            -
              description: "Des signataires ont été indiqués et l'instance n'a pas de service de signature."
        422:
          description: "Le corps est refusé, ou l'inventaire contient plus d'articles qu'un PDF ne peut en contenir. `errors` nomme chaque erreur sous la clé qu'elle concerne."
          x-codes:
            -
              description: "Un PDF ne peut pas contenir autant d'articles, ou les données de l'inventaire sont trop lourdes pour être figées (sur `inventory`, 64 Mo par défaut). `limit` indique combien d'articles un PDF peut contenir ; il est absent quand ce sont les données qui sont trop lourdes."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: "La limite de débit du jeton, ou celle des versions par heure de l'utilisateur, est atteinte ; ou l'espace de travail a déjà fait aujourd'hui autant de demandes de signature qu'il peut en faire (20 par jour par défaut, avec signataires). Attendez `Retry-After` secondes."
  '/inventories/{inventory}/versions/{version}':
    get:
      summary: 'Obtenir une version officielle'
      description: "L'avancement d'une version, avec le SHA-256 de ses fichiers et ce qu'ont fait ses signataires."
      responses:
        200:
          description: 'La version.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
    delete:
      summary: 'Supprimer une version officielle'
      description: "Réservé aux propriétaires. Supprime la version et ses fichiers, et rend leur taille au stockage de l'espace de travail. Une demande de signatures qui attend encore ses signataires est annulée auprès du service de signature en arrière-plan. Une version en cours de génération est supprimée de la même façon. La version suivante est numérotée à la suite de la plus élevée qui reste."
      responses:
        204:
          description: 'La version est supprimée.'
        403:
          description: "Le jeton n'a pas la permission `write`, ou l'utilisateur n'est pas propriétaire de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `write`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
  '/inventories/{inventory}/versions/{version}/pdf':
    get:
      summary: "Télécharger le PDF d'une version"
      description: "Le PDF officiel d'une version terminée, toujours en téléchargement. Il est généré à partir des données figées, jamais à partir de l'inventaire courant, et porte sur chaque page le numéro, la date, l'auteur et le SHA-256 des données, ainsi que la page de signatures lorsque des signataires ont été sollicités. Il n'est jamais conservé par un cache."
      responses:
        200:
          description: 'Le PDF.'
          headers:
            Content-Disposition:
              description: '`attachment` avec le nom du fichier.'
            Content-Length:
              description: 'Octets.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        404:
          description: "Cette ressource n'existe pas, ou elle appartient à un espace de travail dont le propriétaire du jeton n'est pas membre (les deux cas ne sont pas distingués)."
          x-codes:
            -
              description: "La version existe, mais son fichier n'est plus sur le stockage."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: 'La version est encore en cours de génération, ou elle a échoué. Vérifiez son `status`.'
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
        503:
          description: 'Le fichier ne peut pas être lu pour le moment (le stockage est indisponible). Réessayez dans un instant.'
          x-codes:
            -
              description: 'Le stockage ne peut pas être lu pour le moment.'
  '/inventories/{inventory}/versions/{version}/snapshot':
    get:
      summary: "Télécharger les données d'une version"
      description: "Les données figées avec une version terminée, sous forme de fichier JSON (`format` `inventaire.cloud/official-version`) : l'inventaire, ses champs, ses articles et la liste de leurs fichiers, avec des clés triées et sans espace non significatif. Le SHA-256 de ces octets exacts est celui que la version indique sous `snapshot.sha256` (`shasum -a 256` sur le fichier). C'est toujours un téléchargement, jamais conservé par un cache."
      responses:
        200:
          description: 'Les données.'
          headers:
            Content-Disposition:
              description: '`attachment` avec le nom du fichier.'
            Content-Length:
              description: 'Octets.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        404:
          description: "Cette ressource n'existe pas, ou elle appartient à un espace de travail dont le propriétaire du jeton n'est pas membre (les deux cas ne sont pas distingués)."
          x-codes:
            -
              description: "La version existe, mais son fichier n'est plus sur le stockage."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: 'La version est encore en cours de génération, ou elle a échoué. Vérifiez son `status`.'
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
        503:
          description: 'Le fichier ne peut pas être lu pour le moment (le stockage est indisponible). Réessayez dans un instant.'
          x-codes:
            -
              description: 'Le stockage ne peut pas être lu pour le moment.'
  '/inventories/{inventory}/versions/{version}/signed-pdf':
    get:
      summary: "Télécharger le PDF signé d'une version"
      description: "Le PDF avec les signatures, une fois que chaque signataire a signé : le service de signature (Documenso) le renvoie avec les signatures et le certificat d'achèvement, et il est conservé avec la version. C'est toujours un téléchargement, jamais conservé par un cache. Son SHA-256 et sa taille se trouvent sous `signature.signed_pdf` de la version. Il répond `409` jusque-là, et pour une version que personne n'a été invité à signer."
      responses:
        200:
          description: 'Le PDF signé.'
          headers:
            Content-Disposition:
              description: '`attachment` avec le nom du fichier.'
            Content-Length:
              description: 'Octets.'
        403:
          description: "Le jeton n'a pas la permission `read`."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `read`."
        404:
          description: "Cette ressource n'existe pas, ou elle appartient à un espace de travail dont le propriétaire du jeton n'est pas membre (les deux cas ne sont pas distingués)."
          x-codes:
            -
              description: "La version existe, mais son fichier n'est plus sur le stockage."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "Au moins un signataire n'a pas encore signé, ou personne n'a été invité à signer. Vérifiez `signature.status`."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
        503:
          description: 'Le fichier ne peut pas être lu pour le moment (le stockage est indisponible). Réessayez dans un instant.'
          x-codes:
            -
              description: 'Le stockage ne peut pas être lu pour le moment.'
  '/inventories/{inventory}/versions/{version}/signature/cancel':
    post:
      summary: "Annuler la demande de signature d'une version"
      description: |-
        Réservé aux éditeurs et aux propriétaires. Annule la demande de signatures tant que ses signataires sont attendus (`signature.status` vaut `awaiting`) : le service de signature (Documenso) est sollicité immédiatement, prévient les signataires, et la demande passe à `cancelled`. La version, son PDF et ses données ne sont pas touchés ; pour redemander des signatures, figez de nouveau l'inventaire. La réponse est la version.
        Si Documenso indique que la demande n'est plus en attente (le dernier signataire a signé, ou quelqu'un a refusé, un instant plus tôt), rien n'est annulé : la demande est relue en arrière-plan et la réponse est `409` (`signature_not_pending`). Si Documenso est injoignable, la réponse est `503` (`documenso_unavailable`) et rien n'a changé : réessayez.
      responses:
        200:
          description: 'La version, avec une demande `cancelled`.'
        403:
          description: "Le jeton n'a pas la permission `write`, ou l'utilisateur est lecteur de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `write`."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "La demande n'attend pas ses signataires (elle n'a jamais été envoyée, ou elle est terminée), ou Documenso indique qu'elle n'est pas en attente."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du jeton est atteinte.'
        503:
          description: "Le service de signature n'est pas utilisable pour le moment. Rien n'a été annulé."
          x-codes:
            -
              description: "Documenso est injoignable, en panne, ou refuse le jeton de l'instance."
  '/inventories/{inventory}/versions/{version}/signature/retry':
    post:
      summary: "Renvoyer la demande de signature d'une version"
      description: |-
        Réservé aux éditeurs et aux propriétaires. Renvoie une demande de signatures qui a échoué (`signature.status` vaut `failed`) sur une version terminée : elle passe à `requested` et un worker la reprend là où elle s'était arrêtée, avec le même PDF (une enveloppe qui existe chez Documenso n'est pas créée deux fois). La réponse est la version ; interrogez-la jusqu'à ce que `signature.status` soit `awaiting` (ou de nouveau `failed`, avec l'`error`).
        Renvoyer est une demande de signatures comme la première : l'espace de travail peut en faire 20 par jour par défaut, celles d'une version figée avec des signataires comprises (`429` au-delà, avec `Retry-After`).
      responses:
        202:
          description: 'La version, avec une demande `requested`.'
        403:
          description: "Le jeton n'a pas la permission `write`, ou l'utilisateur est lecteur de l'espace de travail."
          x-codes:
            -
              description: "Le jeton n'a pas la permission `write`."
        409:
          description: "La requête est bien formée, mais l'état des données ne la permet pas, ou un quota est atteint."
          x-codes:
            -
              description: "La demande n'a pas échoué, ou sa version n'est pas terminée."
            -
              description: "L'instance n'a pas de service de signature."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: "La limite de débit du jeton est atteinte, ou l'espace de travail a déjà fait aujourd'hui autant de demandes de signature qu'il peut en faire (20 par jour par défaut). Attendez `Retry-After` secondes."
  /templates:
    get:
      summary: "Lister les modèles d'inventaire"
      description: "Le catalogue public, par catégorie puis par nom, dans la langue de la requête. Aucun jeton n'est nécessaire. Pour créer un inventaire à partir d'un modèle, envoyez son `slug` comme `template` à `POST /workspaces/{workspace}/inventories`. Limité à 60 requêtes par minute par défaut, comptées par utilisateur lorsqu'il est connecté, sinon par adresse réseau."
      responses:
        200:
          description: 'Les modèles.'
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du catalogue est atteinte.'
  '/templates/{slug}':
    get:
      summary: "Obtenir un modèle d'inventaire"
      description: "Un modèle avec sa description, les champs qu'il créerait et des lignes d'exemple, dans la langue de la requête. Aucun jeton n'est nécessaire."
      responses:
        200:
          description: 'Le modèle.'
        404:
          description: "Cette ressource n'existe pas, ou elle appartient à un espace de travail dont le propriétaire du jeton n'est pas membre (les deux cas ne sont pas distingués)."
          x-codes:
            -
              description: "Aucun modèle n'a ce slug."
        429:
          description: 'Trop de requêtes. Attendez `Retry-After` secondes.'
          x-codes:
            -
              description: 'La limite de débit du catalogue est atteinte.'
components:
  securitySchemes:
    bearer:
      description: "Un jeton d'accès personnel créé depuis la page Compte de l'application web. Il commence par `inv_`."
  parameters:
    Page:
      description: 'La page à lire, à partir de 1.'
    WorkspaceId:
      description: "L'identifiant de l'espace de travail."
    InventoryId:
      description: "L'identifiant de l'inventaire."
    FieldId:
      description: "L'identifiant du champ. Il doit appartenir à l'inventaire du chemin."
    ItemId:
      description: "L'identifiant de l'article. Il doit appartenir à l'inventaire du chemin."
    AttachmentId:
      description: "L'identifiant de la pièce jointe. Elle doit appartenir à l'article du chemin."
    ExportId:
      description: "L'identifiant de l'export. Seule la personne qui l'a demandé peut le voir."
    ImportId:
      description: "L'identifiant de l'import. Seule la personne qui a envoyé le fichier peut le voir."
    VersionId:
      description: "L'identifiant de la version officielle. Elle doit appartenir à l'inventaire du chemin."
    MemberId:
      description: "L'identifiant du membre, tel que le donne `GET /workspaces/{workspace}/members`. Il désigne la personne dans cet espace de travail seulement."
    InvitationId:
      description: "L'identifiant de l'invitation, tel que le donnent les listes d'invitations. Une invitation qui n'est pas celle de l'espace de travail du chemin (ou pas adressée à l'utilisateur), qui a expiré ou qui a été retirée reçoit la réponse `404`."
    TemplateSlug:
      description: 'Le slug du modèle, tel que listé par `GET /templates`.'
    AcceptLanguage:
      description: "La langue des noms et des résumés (`fr` ou `en`). La langue par défaut de l'instance s'applique en son absence."
  headers:
    RetryAfter:
      description: 'Secondes à attendre avant de réessayer.'
    RateLimitLimit:
      description: 'Requêtes autorisées dans la fenêtre de la limite atteinte.'
    RateLimitRemaining:
      description: 'Requêtes restantes dans la fenêtre.'
    RateLimitReset:
      description: 'Horodatage Unix auquel la fenêtre se termine.'
  responses:
    Unauthenticated:
      description: 'Le jeton est absent, mal formé, expiré ou révoqué.'
    NotFound:
      description: "Cette ressource n'existe pas, ou elle appartient à un espace de travail dont le propriétaire du jeton n'est pas membre (les deux cas ne sont pas distingués)."
    ValidationFailed:
      description: "Le corps ou la chaîne de requête est refusé. `errors` nomme chaque erreur sous la clé qu'elle concerne."
  schemas:
    Ulid:
      description: "L'identifiant d'une ressource, un ULID en minuscules."
    Error:
      description: "L'enveloppe d'une erreur."
      properties:
        message:
          description: "Ce qui s'est passé, à destination d'une personne, dans la langue de la requête. Il peut changer."
        code:
          description: "Pourquoi, à destination d'un programme. Pas sur toutes les erreurs, voir `x-codes` de chaque opération."
    ValidationError:
      description: 'Une requête refusée (`422`).'
      properties:
        message:
          description: "Le premier message, avec le nombre des autres erreurs lorsqu'il y en a davantage."
        errors:
          description: 'Les messages de chaque erreur, par clé de la requête concernée.'
        code:
          description: "Une raison à tester dans votre code, pour les erreurs qui en ont une. Voir `x-codes` de l'opération."
    CodedError:
      description: 'Une erreur qui porte toujours un `code` (`409`, `429`, `503`).'
    ConflictError:
      description: "Une requête refusée à cause de l'état des données ou d'un quota (`409`)."
      allOf:
        - []
        -
          properties:
            limit:
              description: 'Le quota atteint, lorsque le conflit est un quota.'
    PaginationLinks:
      description: 'Les adresses des pages. Elles conservent les paramètres de requête envoyés.'
      properties:
        prev:
          description: 'Null sur la première page.'
        next:
          description: 'Null sur la dernière page.'
    PaginationMeta:
      description: 'Position de la page dans la liste.'
      properties:
        from:
          description: 'Le rang de la première entrée de la page, null quand la page est vide.'
        to:
          description: 'Le rang de la dernière entrée de la page, null quand la page est vide.'
        total:
          description: "Le nombre d'entrées dans toute la liste."
        path:
          description: "L'adresse de la liste, sans la page."
        links:
          description: "La pagination de l'application web, prête à afficher. Préférez `links` de l'enveloppe."
    Timestamp:
      description: 'Un instant, ISO 8601 en UTC.'
    User:
      description: "L'utilisateur auquel appartient un jeton."
      properties:
        id:
          description: "Le numéro du compte. La seule clé numérique que l'API communique."
        locale:
          description: "La langue que suit le compte (`fr`, `en`), null tant qu'elle n'est pas connue."
        is_admin:
          description: "Indique si l'utilisateur administre l'instance."
    FieldType:
      description: 'Un type que peut avoir un champ.'
      properties:
        label:
          description: 'Le nom du type dans la langue de la requête.'
    FieldTypeKey:
      description: 'Le mot qui identifie un type de champ.'
    Role:
      description: "Ce qu'un utilisateur peut faire dans un espace de travail. Les lecteurs lisent, les éditeurs modifient aussi les articles, les champs et les inventaires, les propriétaires suppriment aussi les inventaires et gèrent l'espace de travail."
    Workspace:
      description: "Un espace de travail, vu par l'un de ses membres."
      properties:
        is_current:
          description: "Indique si c'est l'espace de travail dans lequel l'utilisateur travaille dans l'application web."
    InvitableRole:
      description: 'Le rôle que donne une invitation, ou que prend un membre dont on change le rôle : éditeur ou lecteur. Un espace de travail a un seul propriétaire, qui transfère la propriété à la place.'
    Member:
      description: "Un membre d'un espace de travail, vu par la personne qui le demande."
      properties:
        id:
          description: "Désigne le membre dans cet espace de travail seulement. Ce n'est pas le numéro de son compte."
        email:
          description: "L'adresse du membre, pour le propriétaire de l'espace de travail et pour le membre lui-même ; null pour tous les autres."
        joined_at:
          description: "Quand le membre a rejoint l'espace de travail, null si la date n'est pas connue."
        is_self:
          description: "Indique si c'est la personne qui le demande."
    SentInvitation:
      description: 'Une invitation envoyée par un espace de travail qui attend une réponse, vue par son propriétaire.'
      properties:
        email:
          description: "L'adresse à laquelle elle est adressée, en minuscules."
        invited_by:
          description: "Le membre qui l'a envoyée en dernier, null quand son compte a été supprimé depuis."
        expires_at:
          description: "Jusqu'à quand elle peut être acceptée."
    ReceivedInvitation:
      description: "Une invitation adressée à l'utilisateur, avec l'espace de travail auquel elle donne accès."
      properties:
        inviter:
          description: "Qui l'a envoyée, null quand son compte a été supprimé depuis. Seulement le nom : l'utilisateur n'est pas encore membre de l'espace de travail."
        expires_at:
          description: "Jusqu'à quand elle peut être acceptée."
    TooSoonError:
      description: 'Une requête refusée pour le moment (`429`), avec le nombre de secondes à attendre quand le refus le précise.'
      allOf:
        - []
        -
          properties:
            retry_after:
              description: "Secondes à attendre avant de réessayer, avec `resend_too_soon`. C'est le nombre que porte `Retry-After`."
    InventoryAbilities:
      description: "Ce que l'utilisateur peut faire avec l'inventaire, d'après son rôle dans son espace de travail."
      properties:
        update:
          description: 'Modifier le nom et la description.'
        delete:
          description: "Supprimer l'inventaire et tout ce qu'il contient."
        manage_fields:
          description: 'Ajouter, modifier, ordonner et supprimer des champs.'
        edit_items:
          description: 'Ajouter, modifier et supprimer des articles, téléverser des fichiers, importer.'
    Inventory:
      description: "Un inventaire. `fields` n'est fourni que lorsqu'un seul inventaire est lu ou modifié."
      properties:
        fields:
          description: "Les champs dans l'ordre."
    Choice:
      description: "Un choix d'un champ à choix unique ou multiple. Les valeurs contiennent l'`id`, de sorte qu'un choix peut être renommé sans toucher aux articles."
      properties:
        id:
          description: "Créé par le serveur et conservé tant que le choix existe. Quand vous envoyez les choix d'un champ, indiquez l'`id` de ceux qui existent déjà et omettez-le pour les nouveaux : un identifiant que le champ n'a jamais eu est remplacé."
        label:
          description: 'Une seule ligne. Deux choix ne peuvent pas avoir le même libellé (la casse et les accents sont ignorés).'
    ChoiceInput:
      description: "Un choix d'un champ à choix unique ou multiple tel que vous l'envoyez, sans `id` pour un nouveau."
      properties:
        id:
          description: "Créé par le serveur et conservé tant que le choix existe. Quand vous envoyez les choix d'un champ, indiquez l'`id` de ceux qui existent déjà et omettez-le pour les nouveaux : un identifiant que le champ n'a jamais eu est remplacé."
        label:
          description: 'Une seule ligne. Deux choix ne peuvent pas avoir le même libellé (la casse et les accents sont ignorés).'
    FieldOptions:
      description: "Les options d'un champ, telles qu'elles sont renvoyées. Celles qui existent dépendent de son type ; un type sans options a un objet vide. Ce que vous envoyez est `FieldOptionsInput`."
      properties:
        max_length:
          description: '`text` : la valeur la plus longue, en caractères. 255 par défaut.'
        decimals:
          description: "`number` : les décimales qu'une valeur peut avoir (0 à 6, aucune par défaut). `percentage` : 0 à 4, 2 par défaut. Pour `money`, elles sont données par la devise et ne peuvent pas être envoyées."
        min:
          description: '`number` : la plus petite valeur, une chaîne décimale.'
        max:
          description: '`number` : la plus grande valeur, une chaîne décimale. `rating` : la note maximale, un entier de 3 à 10 (5 par défaut).'
        unit:
          description: '`number` : une unité affichée à côté de la valeur, comme `kg`.'
        currency:
          description: '`money` : un code ISO 4217 comme `EUR` (par défaut) ou `USD`.'
        format:
          description: "`barcode` : le format de code exigé pour une valeur (`any` : jusqu'à 64 lettres, chiffres, tirets et points ; les autres vérifient le chiffre de contrôle)."
        max_files:
          description: '`file` et `photo` : le nombre de fichiers que le champ accepte (1 par défaut).'
        choices:
          description: '`select` et `multiselect` : les choix, au moins un. La liste que vous envoyez remplace la liste existante.'
    FieldOptionsInput:
      description: "Les options que vous envoyez pour un champ : celles de `FieldOptions`, avec les choix sous forme de `ChoiceInput`. Celles qui existent dépendent de son type, et une option que le type n'a pas est refusée avec une `422`. Quand vous modifiez un champ, les options envoyées sont fusionnées avec les options existantes, et une option envoyée à `null` revient à sa valeur par défaut."
      properties:
        max_length:
          description: '`text` : la valeur la plus longue, en caractères. 255 par défaut.'
        decimals:
          description: "`number` : les décimales qu'une valeur peut avoir (0 à 6, aucune par défaut). `percentage` : 0 à 4, 2 par défaut. Pour `money`, elles sont données par la devise et ne peuvent pas être envoyées."
        min:
          description: '`number` : la plus petite valeur, une chaîne décimale.'
        max:
          description: '`number` : la plus grande valeur, une chaîne décimale. `rating` : la note maximale, un entier de 3 à 10 (5 par défaut).'
        unit:
          description: '`number` : une unité affichée à côté de la valeur, comme `kg`.'
        currency:
          description: '`money` : un code ISO 4217 comme `EUR` (par défaut) ou `USD`.'
        format:
          description: "`barcode` : le format de code exigé pour une valeur (`any` : jusqu'à 64 lettres, chiffres, tirets et points ; les autres vérifient le chiffre de contrôle)."
        max_files:
          description: '`file` et `photo` : le nombre de fichiers que le champ accepte (1 par défaut).'
        choices:
          description: '`select` et `multiselect` : les choix, au moins un. La liste que vous envoyez remplace la liste existante.'
    Field:
      description: "Une colonne typée d'un inventaire."
      properties:
        type:
          description: "L'une des valeurs de `FieldTypeKey`. Il ne peut pas être modifié. Un type que cette version ne connaît pas est donné tel qu'il est stocké."
        required:
          description: 'Indique si un article doit avoir une valeur pour ce champ. Jamais vrai pour `file` et `photo`.'
        position:
          description: "La position du champ dans l'inventaire, à partir de 0."
        query_kind:
          description: 'La façon dont la liste des articles trie et filtre le champ. `text`, `number`, `temporal` (date, instant, heure), `boolean` et `choice` peuvent être triés. Toutes les natures peuvent être filtrées avec `empty` ; `number` et `temporal` acceptent aussi `min` et `max`, `boolean` accepte `is`, `choice` et `choices` acceptent `in`. Null pour un type que cette version ne connaît pas.'
        summable:
          description: 'Indique si les totaux de la liste des articles peuvent additionner les valeurs (`number` et `money`).'
    ItemValue:
      description: "La valeur d'un champ. Une chaîne pour texte, texte long, URL, e-mail, téléphone, couleur, code-barres, date, date et heure, heure et choix unique ; une chaîne décimale pour nombre, montant et pourcentage ; un booléen pour oui / non ; un entier pour note ; un tableau de chaînes pour choix multiple, mots clés et les identifiants des pièces jointes de fichier et photo."
    ItemValues:
      description: "Les valeurs d'un article, indexées par l'identifiant du champ. Un champ sans valeur est absent."
    ItemValuesInput:
      description: "Les valeurs à écrire, indexées par l'identifiant du champ. Une clé qui n'est pas un champ de l'inventaire, ainsi qu'un champ `file` ou `photo`, sont refusés. `null`, un texte vide ou une liste vide efface un champ (refusé pour un champ obligatoire)."
    Item:
      description: "Une ligne d'un inventaire."
      properties:
        attachments:
          description: "Tous les fichiers de l'article, y compris ceux de ses champs fichier et photo."
    FieldRef:
      description: "Un champ, tel que l'historique le nomme."
    RevisionChange:
      description: "Ce qui a changé. Pour `created` et `updated`, c'est une entrée par champ, avec les valeurs telles que l'article les présente actuellement. Pour `attachment_added` et `attachment_removed`, c'est une entrée qui nomme le fichier."
      oneOf:
        -
          title: 'Changement de valeur'
          properties:
            before:
              description: "La valeur avant, null s'il n'y en avait pas."
            after:
              description: 'La valeur après, null quand le champ a été effacé.'
        -
          title: 'Changement de fichier'
          properties:
            field:
              description: 'Le champ fichier ou photo auquel appartenait le fichier, null pour une simple pièce jointe ou si le champ a été supprimé depuis.'
    Revision:
      description: "Une ligne de l'historique d'un article."
      properties:
        user:
          description: "Qui l'a fait, null quand son compte a été supprimé depuis."
    Attachment:
      description: 'Un fichier joint à un article.'
      properties:
        field:
          description: 'Le champ fichier ou photo que le fichier renseigne, null pour une simple pièce jointe.'
        mime:
          description: "Le type détecté d'après le contenu lors du téléversement du fichier."
        size:
          description: 'Octets.'
        width:
          description: 'Pixels, pour une image.'
        height:
          description: 'Pixels, pour une image.'
        uploaded_by:
          description: 'Null quand le compte de la personne qui a téléversé le fichier a été supprimé depuis.'
        url:
          description: "Le chemin du fichier, relatif à l'hôte (il commence déjà par `/api/v1`). Appelez-le avec votre jeton."
        thumbnail_url:
          description: "Le chemin de la miniature, un JPEG. Null quand le fichier n'en a pas."
    ExportScope:
      description: "`all` : tous les articles. `view` : les articles qu'afficherait une liste avec le `query` donné."
    Export:
      description: "Un fichier des articles d'un inventaire, généré en arrière-plan pour la personne qui l'a demandé."
      properties:
        error:
          description: "Pour un export échoué, ce qui s'est mal passé, dans la langue de la requête. Null sinon."
        file_name:
          description: "Null tant que l'export n'est pas terminé."
        size:
          description: "Octets. Null tant que l'export n'est pas terminé."
        items_count:
          description: "Le nombre d'articles dans le fichier. Null tant que l'export n'est pas terminé."
        expires_at:
          description: "Quand le fichier est supprimé (24 heures après la fin de l'export par défaut). Null tant qu'il n'est pas terminé."
        download_url:
          description: "Le chemin du fichier, relatif à l'hôte. Null tant que l'export n'est pas terminé et après son expiration."
    ImportStatus:
      description: "`uploaded` : le fichier a été lu et attend que vous le lanciez. `pending` : lancé, en attente d'un worker. `running`. `completed` ou `failed` : le rapport est conservé 24 heures par défaut."
    ImportOptions:
      description: 'La façon dont le fichier est lu et dont ses cellules sont interprétées.'
      properties:
        has_header:
          description: 'Indique si la première ligne contient les noms des colonnes.'
        delimiter:
          description: "Le séparateur d'un fichier texte. Null pour une feuille de calcul."
        encoding:
          description: "L'encodage d'un fichier texte. Null pour une feuille de calcul."
        decimal:
          description: 'Le signe décimal des nombres du fichier.'
        date_order:
          description: "L'ordre du jour, du mois et de l'année dans les dates écrites en chiffres."
        on_error:
          description: "`abort` : rien n'est importé si une ligne est refusée. `skip` : les lignes refusées sont écartées et signalées."
    ImportColumn:
      description: 'Une colonne du fichier.'
      properties:
        index:
          description: 'La position de la colonne, à partir de 0.'
        header:
          description: "Le nom de la colonne, ou une lettre quand elle n'en a pas."
        samples:
          description: 'Quelques valeurs de la colonne.'
        fraction_like:
          description: "Indique si les valeurs sont des nombres compris entre -1 et 1 qui ne sont pas tous entiers, comme un tableur stocke les pourcentages (12.5 % vaut 0.125) : vérifiez avant d'associer la colonne à un champ pourcentage."
    ImportMappingEntry:
      description: 'Où va une colonne.'
      properties:
        column:
          description: "L'`index` de la colonne."
        target:
          description: '`ignore` : la colonne est écartée. `field` : elle renseigne le champ existant `field`. `new` : un champ de type `type` nommé `name` est créé pour elle (demande le droit de modifier les champs).'
        field:
          description: "L'identifiant du champ, pour la cible `field`."
        type:
          description: 'Le type du nouveau champ, pour la cible `new`. Pas `file`, `photo` ni `multiselect`.'
        name:
          description: 'Le nom du nouveau champ, pour la cible `new`.'
    ImportRowError:
      description: 'Une ligne qui a été refusée.'
      properties:
        row:
          description: 'Le numéro de la ligne dans le fichier.'
        column:
          description: "Le nom de la colonne concernée par l'erreur, null quand elle concerne la ligne."
    Import:
      description: "Un fichier importé dans un inventaire. Il est lu à l'envoi (colonnes, estimation de leurs types et proposition de mapping), puis vous le lancez et un worker ajoute les articles."
      properties:
        error:
          description: "Pour un import échoué, ce qui s'est mal passé, dans la langue de la requête. Null sinon."
        size:
          description: 'Octets.'
        mapping:
          description: "La proposition tant que l'import est `uploaded`, puis ce qui a été lancé."
        rows_total:
          description: "Les lignes qui contiennent quelque chose. Null tant que l'import n'est pas terminé."
        rows_imported:
          description: "Null tant que l'import n'est pas terminé."
        rows_failed:
          description: "Null tant que l'import n'est pas terminé."
        fields_created:
          description: "Null tant que l'import n'est pas terminé."
        errors:
          description: "Les 100 premières lignes refusées. Null tant que l'import n'est pas terminé."
        expires_at:
          description: "Quand le rapport, ou un fichier envoyé et jamais lancé, est supprimé. Null tant que l'import est lancé et n'est pas terminé."
    VersionStatus:
      description: "L'avancement de la génération du PDF. `pending` : figée, en attente d'un worker. `running`. `completed` : le PDF et les données peuvent être téléchargés. `failed` : rien n'a été conservé, l'`error` dit pourquoi, et la version ne peut plus qu'être supprimée."
    SignatureStatus:
      description: "L'avancement de la demande de signatures. `requested` : demandée, pas encore envoyée au service de signature. `sending`. `awaiting` : les signataires ont reçu leurs e-mails et tous n'ont pas signé. `completed` : tout le monde a signé et le PDF signé est conservé. `rejected` : un signataire a refusé. `cancelled` : annulée ici ou auprès du service de signature. `failed` : la demande n'a pas pu être envoyée ou a été perdue, l'`error` dit pourquoi."
    SignerStatus:
      description: "L'avancement d'un signataire. `pending` : n'a pas encore signé. `signed`. `rejected` : a refusé de signer."
    SignerInput:
      description: 'Une personne dont demander la signature.'
      properties:
        name:
          description: "Le nom, tel qu'il apparaît sur la page de signatures et dans l'e-mail que la personne reçoit."
        email:
          description: "L'adresse e-mail à laquelle le service de signature écrit."
    Signer:
      description: "Une personne invitée à signer une version, et ce qu'elle a fait."
      properties:
        signed_at:
          description: "Quand elle a signé. Null tant qu'elle ne l'a pas fait."
        rejection_reason:
          description: "Pourquoi elle a refusé de signer, quand elle l'a dit."
    InventoryVersion:
      description: 'Un inventaire figé à une date : numéroté inventaire par inventaire, avec les données figées, le PDF officiel généré à partir de celles-ci et, lorsque des signatures ont été demandées, leur avancement.'
      properties:
        number:
          description: "1 pour la première version de l'inventaire, puis 2, 3... Une nouvelle version est numérotée à la suite de la plus élevée qui reste."
        label:
          description: "Le nom que la personne qui a figé l'inventaire a donné à la version."
        error:
          description: "Pour une version échouée, ce qui s'est mal passé, dans la langue de la requête. Null sinon."
        author:
          description: "Qui a figé l'inventaire. Le nom est conservé avec la version quand le compte est supprimé."
        items_count:
          description: "Le nombre d'articles qui ont été figés."
        fields_count:
          description: 'Le nombre de champs qui ont été figés.'
        snapshot:
          description: 'Les données figées, un fichier JSON canonique. Tout le reste est généré à partir de lui.'
          properties:
            sha256:
              description: 'Le SHA-256 des octets du fichier, en hexadécimal.'
            size:
              description: 'Octets.'
            download_url:
              description: "Le chemin du fichier, relatif à l'hôte. Null tant que la version n'est pas terminée (`status` vaut `completed`), car le téléchargement répond `409` (`version_not_ready`) avant cela."
        pdf:
          description: "Le PDF officiel. Null tant que la version n'est pas terminée."
          oneOf:
            -
              properties:
                size:
                  description: 'Octets.'
                download_url:
                  description: "Le chemin du fichier, relatif à l'hôte."
            - []
        signature:
          description: "La demande de signatures. Null pour une version que personne n'a été invité à signer."
          oneOf:
            -
              properties:
                error:
                  description: "Pour une demande échouée ou perdue, ce qui s'est mal passé, dans la langue de la requête. Null sinon."
                requested_at:
                  description: "Quand le service de signature a envoyé les e-mails. Null tant qu'il ne l'a pas fait."
                completed_at:
                  description: 'Quand le dernier signataire a signé et que le PDF signé a été conservé. Null jusque-là.'
                signed_pdf:
                  description: "Le PDF avec les signatures. Null tant que chaque signataire n'a pas signé."
                  oneOf:
                    -
                      properties:
                        size:
                          description: 'Octets.'
                        download_url:
                          description: "Le chemin du fichier, relatif à l'hôte."
                    - []
            - []
        abilities:
          description: "Ce que le propriétaire du jeton peut faire avec cette version en ce moment, d'après son rôle et l'état de la version."
          properties:
            delete:
              description: "Les propriétaires de l'espace de travail."
            cancel_signature:
              description: 'Les éditeurs et les propriétaires, tant que les signataires sont attendus.'
            retry_signature:
              description: 'Les éditeurs et les propriétaires, pour une version terminée dont la demande de signatures a échoué.'
    TemplateBase:
      description: "Comment s'appelle un modèle et où en lire la présentation. La liste et le détail le partagent."
      properties:
        category_label:
          description: 'Le nom de la catégorie dans la langue de la requête.'
        icon:
          description: "Le nom d'une icône Tabler."
        name:
          description: "Le nom de l'inventaire que le modèle crée."
        summary:
          description: 'Une phrase.'
        url:
          description: 'La page publique du modèle, dans la langue de la requête.'
    TemplateSummary:
      description: 'Un modèle, de quoi afficher une carte.'
    TemplateChoice:
      description: "Un choix d'un champ de modèle. La `key` est le nom sous lequel les exemples le désignent ; les identifiants sont créés à la création d'un inventaire."
    TemplateField:
      description: 'Un champ que le modèle créerait.'
      properties:
        key:
          description: 'Ce par quoi les exemples sont indexés.'
        type_label:
          description: 'Le nom du type dans la langue de la requête.'
        options:
          description: 'Les options du champ telles que le fichier du modèle les donne (voir `FieldOptions` pour la signification de chacune) ; `choices` liste des `TemplateChoice`.'
    Template:
      description: "Un modèle avec sa description, ses champs et ses lignes d'exemple."
      allOf:
        - []
        -
          properties:
            description:
              description: 'Les paragraphes de la description.'
            examples:
              description: "Des lignes d'exemple, indexées par la `key` des champs, avec des valeurs écrites comme l'API les écrit. Elles ne sont jamais enregistrées dans un inventaire."
