            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
          x-codes:
            - code: version_limit_reached
              description: The inventory already holds as many versions as allowed. `limit` says how many.
            - code: storage_limit_reached
              description: The files of the workspace already weigh as much as allowed. `limit` is in bytes.
            - code: signature_unavailable
