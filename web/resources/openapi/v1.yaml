    post:
      tags:
        - Official versions
      operationId: cancelVersionSignature
      summary: Cancel the signature request of a version
      description: >-
        Editors and owners only. Cancels the request for signatures while its signers are awaited (`signature.status` is `awaiting`):
        the signature service (Documenso) is asked at once, tells the signers, and the request becomes `cancelled`. The version, its
        PDF and its data are untouched; to ask for signatures again, freeze the inventory again. The answer is the version.

        If Documenso says the request is not pending any more (the last signer signed, or somebody refused, a moment before), nothing is
        cancelled: the request is read again in the background and the answer is `409` (`signature_not_pending`). If Documenso cannot
        be reached, the answer is `503` (`documenso_unavailable`) and nothing has changed: try again.
