  /inventories/{inventory}/imports/{import}/start:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags:
        - Imports
      operationId: startImport
      summary: Start an import
      description: >-
        Says where each column goes and starts the import: a worker converts, checks and adds the rows in one
        transaction, and creates the new fields. `mapping` has one entry per column to use; a column left out is
        ignored. A required field of the inventory must be mapped. Creating fields (`target: new`) needs the right to
        change the fields (editors and owners) and, for a token, the `manage` permission on top of `write`: with
        `write` alone the mapping can only go to existing fields (`cannot_manage_fields` otherwise). The answer is the import, `pending`; poll it. An inventory holds 10000
        items by default and a file 10000 rows.
      x-ability: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mapping
              properties:
                mapping:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required:
                      - column
                      - target
                    properties:
                      column:
                        type: integer
                        minimum: 0
                        description: The `index` of a column.
                      target:
                        type: string
                        enum:
                          - ignore
                          - field
                          - new
                      field:
                        type:
                          - string
                          - 'null'
                        maxLength: 26
                        description: The id of the field. Required for the target `field`.
                      type:
                        type:
                          - string
                          - 'null'
                        maxLength: 32
                        description: The type of the new field. Required for the target `new`.
                      name:
                        type:
                          - string
                          - 'null'
                        maxLength: 500
                        description: The name of the new field. Required for the target `new`.
                decimal:
                  type: string
                  enum:
                    - comma
                    - point
                  description: Kept from the import when not sent.
                date_order:
                  type: string
                  enum:
                    - dmy
                    - mdy
                    - ymd
                  description: Kept from the import when not sent.
                on_error:
                  type: string
                  enum:
                    - abort
                    - skip
                  description: Kept from the import when not sent.
      responses:
        '202':
          description: The import, `pending`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `write` ability, or the user is a viewer of the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the write permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `write` ability.
        '404':
          description: >-
            There is no such resource, or it belongs to a workspace the owner of the token is not a member of (the two are
            not told apart).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-codes:
            - code: import_expired
              description: The time of the import is up and its file is gone. Send the file again.
        '409':
          description: The request is well formed but the state of the data does not allow it, or a quota is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
          x-codes:
            - code: import_not_editable
              description: The import was started already.
            - code: field_limit_reached
              description: The new fields would take the inventory past the number of fields it may have. `limit` says how many.
        '422':
          description: The body or the query string is refused. `errors` names each fault under the key it is about.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The name field is required.
                errors:
                  name:
                    - The name field is required.
          x-codes:
            - code: unknown_column
              description: The file has no such column (on `mapping`, with `column`).
            - code: duplicate_column
              description: A column is given twice (with `column`).
            - code: unknown_field
              description: The field does not exist in this inventory (with `column`).
            - code: field_not_importable
              description: The field is filled by uploading files (with `column` and `field`).
            - code: duplicate_field
              description: Two columns go to the same field (with `column` and `field`).
            - code: invalid_field_type
              description: A field of this type cannot be created by an import (with `column`).
            - code: invalid_field_name
              description: The name of a new field is empty, too long or on several lines (with `column`).
            - code: duplicate_field_name
              description: Two new fields have the same name (with `column`).
            - code: field_name_taken
              description: The inventory already has a field with this name (with `column`).
            - code: cannot_manage_fields
              description: The user may not create fields, or the token lacks `manage`, which creating a field takes (with `column`).
            - code: required_field_unmapped
              description: A required field has no column (with `field`).
            - code: nothing_mapped
              description: Not one column is mapped.
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
