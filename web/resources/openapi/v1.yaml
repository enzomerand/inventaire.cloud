  /inventories/{inventory}/items:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    get:
      tags:
        - Items
      operationId: listItems
      summary: List the items of an inventory
      description: |-
        A page of 50 items, newest first unless `sort` says otherwise.

        - `q` keeps the items that hold every word, whatever the case and the accents.
        - `filter[<field id>][<operator>]` keeps the items that meet every condition. `empty` (`true` or `false`) works
          on every field. A number, rating or date field takes `min` and `max` (both included, written the way the
          value is stored), a yes/no field `is`, a single or multiple choice field `in` (ids of choices, any of them
          matches: `filter[<field id>][in][]=<choice id>`). Text and tags are searched with `q`, not filtered.
        - `sort` is `created_at`, `updated_at` or the id of a field, with `direction`. Items without a value come last.
          Multiple choice, tags, file and photo fields cannot be sorted. The kinds are in `query_kind` of each field.
        - `totals[]` adds up number and amount fields over **all** the items that match, not only the page. It is
          opt-in because it costs a pass over the values: without it `meta.totals` is absent.

        The query string is checked as a whole: every fault is reported at once in a `422`, under keys such as `sort`,
        `direction`, `filter.<field id>.<operator>` and `totals.<position>`.
      x-ability: read
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: q
          in: query
          description: The words to search for. At most 200 characters; spaces only is no search.
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          description: What to sort by. Without it, the newest item comes first and `direction` changes nothing.
          schema:
            type: string
            maxLength: 64
            examples:
              - created_at
        - name: direction
          in: query
          description: The direction of the sort, in any case.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: filter
          in: query
          style: deepObject
          explode: true
          description: >-
            Conditions on fields: `filter[<field id>][<operator>]=<value>`, for instance `filter[01k8…][min]=10` or
            `filter[01k8…][empty]=false`. The operators a field takes depend on its `query_kind`.
          schema:
            type: object
            propertyNames:
              pattern: ^[0-9a-zA-Z]{26}$
            additionalProperties:
              type: object
              additionalProperties: false
              properties:
                empty:
                  type: boolean
                  description: Whether the field holds no value. Every kind of field.
                min:
                  type: string
                  description: Smallest value, included. `number` and `temporal` kinds.
                max:
                  type: string
                  description: Largest value, included. `number` and `temporal` kinds.
                is:
                  type: boolean
                  description: The yes or no to find. `boolean` kind.
                in:
                  type: array
                  description: Ids of choices, any of which matches. `choice` and `choices` kinds.
                  items:
                    type: string
        - name: totals[]
          in: query
          style: form
          explode: true
          description: >-
            The ids of the number and amount fields to add up: `totals[]=<field id>`, repeated for each field. A field
            that does not exist or cannot be added up is a `422` on `totals.<position>`.
          schema:
            type: array
            items:
              type: string
              maxLength: 64
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - links
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PaginationMeta'
                      - type: object
                        required:
                          - limits
                        properties:
                          limits:
                            type: object
                            description: The limits of attachments, so that a client can check a file before sending it.
                            required:
                              - attachment_size
                              - attachments_per_item
                            properties:
                              attachment_size:
                                type: integer
                                description: The largest file, in bytes (20 MB by default).
                              attachments_per_item:
                                type: integer
                                description: The most files one item may hold (20 by default).
                          totals:
                            type: object
                            description: >-
                              The sum of each field asked for in `totals[]`, over all the matching items, keyed by the
                              id of the field, as decimal strings. Zero (`"0.00"`) when no item holds a value.
                            additionalProperties:
                              type: string
