openapi: 3.1.0
info:
  title: inventaire.cloud API
  version: '1'
  summary: The public JSON API of inventaire.cloud.
  description: |
    The public API of inventaire.cloud: workspaces, inventories, fields, items and their files, exports, imports and official versions.
    Most of what the web application does with your data can be done here, with a personal access token.

    ## Authentication

    Create a personal access token from the account page of the web application (card "API tokens"): choose a name,
    the abilities it carries and an expiry (7, 30, 90 or 365 days, or never). The value starts with `inv_` and is shown
    once, when the token is created: copy it then. Send it with every request:

        Authorization: Bearer inv_…

    A missing, malformed, expired or revoked token is answered with `401`. Signing out everywhere from the account page
    revokes every token of the account. Sign-in, the account itself, the administration and the management of tokens
    belong to the web application and are not part of this API: they refuse a request made with a token (`403`,
    `session_required`).

    Send the token alone. A request that carries the session cookie of the web application as well is answered with `403`
    and the code `token_with_session`, whatever the token can do: with both, it would be unclear which of the two decides.

    ## Abilities

    A token carries one or more abilities, and every operation of this document names the one it needs in `x-ability`:

    - `read`: every `GET` operation;
    - `write`: the content of an inventory, that is items, attachments, exports, imports and official versions (create, change, delete);
    - `manage`: the structure, that is workspaces, inventories and fields (create, change, delete).

    The abilities are independent: `write` and `manage` do not include `read`. A token that cannot read can hardly be
    used, since the ids that the other operations need are found with `GET`: give `read` along with the others. What a
    `write` operation answers is the resource it wrote (the item, the attachment, the export, the import or the version), so `write`
    sees what it writes. `manage` can delete a workspace or an inventory with all the data in it: give it only to what
    needs it. A request made with a token that lacks the ability is answered with `403` and the code
    `token_ability_missing`.

    A token never goes beyond its owner. Whatever its abilities, it can do only what the owner may do in each workspace
    with their role: `owner`, `editor` or `viewer`. A resource of a workspace the owner does not belong to is answered
    with `404`, as if it did not exist; a member whose role does not allow the operation is answered with `403`
    (without `code`).

    ## Rate limits

    Each token may make 120 requests per minute by default (the administrator of the instance can change it). Every
    request made with a token counts, those that are refused too. Beyond the limit the answer is `429` with the code
    `too_many_requests` and a `Retry-After` header, the number of seconds to wait.

    Some operations have a stricter limit of their own, counted per user: creating a workspace, uploading a file,
    asking for an export, sending or re-reading a file to import, freezing an inventory as an official version. A request that is refused before it gets that far (a
    token that lacks the ability, for instance) does not use it up. Past it the answer is `429` as well, with
    `Retry-After`. The public template catalogue has its own limit, per network address.

    Answers carry `X-RateLimit-Limit` and `X-RateLimit-Remaining`. When several limits apply to a request (the token's
    and the operation's), the headers describe the one with the fewest requests left: on an export they are those of the
    export limit as soon as it is closer than the token's. On a `429` they are those of the limit that was exceeded,
    with `Retry-After`.

    ## Errors

    An error always has a JSON body, whatever the `Accept` header:

    - `{"message": "…"}` for `401`, `403` and `404`; the message is for people and may change. `403` has a `code` when a
      machine-readable reason exists (`token_ability_missing`, `token_with_session`, `session_required`), `404` has one for the few cases that
      are not a plain "not found";
    - `{"message": "…", "code": "…"}` for `409`, `429` and `503`, where `code` is the reason to switch on. A `409` that
      comes from a quota also has a `limit`, the number that was crossed;
    - `{"message": "…", "errors": {"<field>": ["…"]}}` for `422`, with the keys of the request body (`values.<field id>`,
      `options.max`, `query.filter.<field id>.min`…); a few refusals add a `code` and the facts that explain it.

    Each error response of an operation lists, in `x-codes`, the `code` values it can carry.

    ## Identifiers and dates

    Resources are identified by lowercase ULIDs (26 characters, digits and letters), in paths and in bodies. The numeric
    keys of the database are never exposed; the only exception is the `id` of the account in `GET /me`. Dates are ISO 8601
    in UTC (`2026-10-15T12:30:00+00:00`).

    ## Items and their values

    The `values` of an item are a JSON object keyed by the id of the field. A field that holds no value is absent. The
    JSON type depends on the type of the field (`GET /field-types`): text, long text, URL, email, phone, color, barcode,
    date (`YYYY-MM-DD`), date and time (UTC, `2026-10-15T12:30:00Z`), time (`HH:MM`) and single choice (the id of the
    choice) are strings; number, amount and percentage are **decimal strings** (`"12.50"`, never a JSON number, so that
    nothing is lost); yes/no is a boolean; rating is an integer; multiple choice and tags are arrays of strings; file
    and photo are arrays of attachment ids, written by uploading files, never by sending values.

    To write, send the same shapes (numbers may also be sent as JSON numbers, but send them as text when they have
    many digits). Sending `null`, an empty text or an empty list for a field clears it.

    ## Pagination

    Lists that can be long are paginated with the `page` query parameter (1 by default): 50 items, 25 revisions or 20 versions per
    page. The answer is `{"data": […], "links": {"first", "last", "prev", "next"}, "meta": {"current_page", "last_page",
    "per_page", "total", "from", "to", "path", "links"}}`; the links of the pages keep your other query parameters.
    The other lists (workspaces, inventories, field types, templates) are answered in one piece, in `data`; the lists of
    exports and imports hold the 20 newest.

    ## Language

    Messages and labels (the name of a field type, the error of a failed export) are in the language of the
    `Accept-Language` header (`fr` or `en`); the instance default applies without it. Identifiers, codes and the data
    you stored are never translated.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: This instance. Paths below are relative to it.
security:
  - bearer: []
tags:
  - name: Account
    x-displayName: Account
    description: The user a token belongs to.
  - name: Field types
    x-displayName: Field types
    description: The types a field can have, with their names in the language of the request.
  - name: Workspaces
    x-displayName: Workspaces
    description: The workspaces the user belongs to, with their role in each.
  - name: Inventories
    x-displayName: Inventories
    description: The inventories of a workspace, with their fields and what the user may do with them.
  - name: Fields
    x-displayName: Fields
    description: The typed columns of an inventory (add, change, order, delete).
  - name: Items
    x-displayName: Items
    description: The rows of an inventory, with sorting, filtering, search and totals.
  - name: Revisions
    x-displayName: Revisions
    description: The history of an item, latest change first.
  - name: Attachments
    x-displayName: Attachments
    description: Files attached to an item, or filling one of its file or photo fields.
  - name: Exports
    x-displayName: Exports
    description: Files of the items of an inventory (XLSX, ODS, CSV, JSON, PDF, zip), written in the background.
  - name: Imports
    x-displayName: Imports
    description: Spreadsheets and CSV files brought into an inventory, with a mapping of their columns, run in the background.
  - name: Official versions
    x-displayName: Official versions
    description: >-
      The inventory frozen as numbered, dated versions, each with its data (JSON), its PDF and, if asked for, signatures by email.
  - name: Templates
    x-displayName: Templates
    description: The public catalogue of inventory templates. No token needed.
paths:
  /me:
    get:
      tags:
        - Account
      operationId: getCurrentUser
      summary: Get the user of the token
      description: Who the token belongs to. Handy to check that a token works.
      x-ability: read
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `read` ability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the read permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `read` ability.
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the token is reached.
  /field-types:
    get:
      tags:
        - Field types
      operationId: listFieldTypes
      summary: List the field types
      description: >-
        Every type a field can have, in the order the web application offers them. `type` is the word to send when
        adding a field.
      x-ability: read
      responses:
        '200':
          description: The types.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldType'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `read` ability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the read permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `read` ability.
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the token is reached.
  /workspaces:
    get:
      tags:
        - Workspaces
      operationId: listWorkspaces
      summary: List the workspaces
      description: Every workspace the owner of the token belongs to, oldest membership first, with their role in each.
      x-ability: read
      responses:
        '200':
          description: The workspaces.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `read` ability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the read permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `read` ability.
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the token is reached.
    post:
      tags:
        - Workspaces
      operationId: createWorkspace
      summary: Create a workspace
      description: >-
        Creates a workspace owned by the user. Anybody can, within the number of workspaces an account may belong to
        (50 by default) and a pace of 20 creations an hour by default.
      x-ability: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The name. Spaces around it are removed.
      responses:
        '201':
          description: The workspace that was created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `manage` ability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the manage permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `manage` ability.
        '409':
          description: The request is well formed but the state of the data does not allow it, or a quota is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
          x-codes:
            - code: workspace_limit_reached
              description: The account already belongs to as many workspaces as allowed. `limit` says how many.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the token, or the creations an hour of the user, is reached.
  /workspaces/{workspace}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      tags:
        - Workspaces
      operationId: updateWorkspace
      summary: Rename a workspace
      description: Owners only.
      x-ability: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The new name. Spaces around it are removed.
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `manage` ability, or the user is not an owner of the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the manage permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `manage` ability.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the token is reached.
    delete:
      tags:
        - Workspaces
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: >-
        Deletes the workspace and everything in it: inventories, items, files. Owners only. The last workspace of a
        user cannot be deleted. If it was the one the user was working in, another takes its place.
      x-ability: manage
      responses:
        '204':
          description: The workspace is deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `manage` ability, or the user is not an owner of the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the manage permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `manage` ability.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is well formed but the state of the data does not allow it, or a quota is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
          x-codes:
            - code: last_workspace
              description: It is the last workspace of the user. Create another one first.
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the token is reached.
  /workspaces/{workspace}/inventories:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags:
        - Inventories
      operationId: listInventories
      summary: List the inventories of a workspace
      description: >-
        Every inventory of the workspace, by name, with the number of its fields and items. The fields themselves are
        not listed: read an inventory for them.
      x-ability: read
      responses:
        '200':
          description: The inventories.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inventory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `read` ability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the read permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `read` ability.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the token is reached.
    post:
      tags:
        - Inventories
      operationId: createInventory
      summary: Create an inventory
      description: >-
        Adds an inventory to the workspace. Editors and owners only. With `template` (a slug of `GET /templates`) the
        inventory gets the fields of the template, named in the language of the request. A workspace holds 100
        inventories by default.
      x-ability: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: One line.
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 2000
                template:
                  type:
                    - string
                    - 'null'
                  maxLength: 60
                  description: The slug of a template. Unknown slugs are a `422`.
      responses:
        '201':
          description: The inventory that was created. `fields` is not given, read the inventory for them.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Inventory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `manage` ability, or the user is a viewer of the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the manage permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `manage` ability.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is well formed but the state of the data does not allow it, or a quota is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
          x-codes:
            - code: inventory_limit_reached
              description: The workspace already holds as many inventories as allowed. `limit` says how many.
            - code: field_limit_reached
              description: The template has more fields than an inventory may have. `limit` says how many.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the token is reached.
  /inventories/{inventory}:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    get:
      tags:
        - Inventories
      operationId: getInventory
      summary: Get an inventory
      description: The inventory with its fields in order and what the user may do with it.
      x-ability: read
      responses:
        '200':
          description: The inventory.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Inventory'
                      - type: object
                        required:
                          - fields
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The token lacks the `read` ability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This API token lacks the read permission.
                code: token_ability_missing
          x-codes:
            - code: token_ability_missing
              description: The token lacks the `read` ability.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
