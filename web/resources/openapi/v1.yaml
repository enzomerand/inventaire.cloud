            Content-Length:
              description: Bytes.
              schema:
                type: integer
            ETag:
              description: The id of the file, quoted.
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-cache`.
              schema:
                type: string
          content:
            image/jpeg:
