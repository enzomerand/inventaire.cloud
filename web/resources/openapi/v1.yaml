    post:
      tags:
        - Official versions
      operationId: createVersion
      summary: Freeze the inventory as an official version
      description: >-
        Freezes the inventory as its next official version, numbered 1, 2, 3... Editors and owners only. The state of the inventory
        at that moment is written as a canonical JSON file (`snapshot`, with its SHA-256) while the inventory is locked against
        writes, which takes a second or two for thousands of items; a PDF is then written from that file in the background. The
        answer is the version, `pending`: poll `GET /inventories/{inventory}/versions/{version}` until its `status` is
        `completed` (or `failed`), then download the files.

        `signers` asks the signature service of the instance (Documenso) to have the PDF signed by each person: it adds a page of
        signatures to the PDF and sends each signer an email. It needs the instance to have one (`signature_unavailable`). The
        people are fixed for the version: to ask others, freeze the inventory again.

        An inventory holds 200 versions by default (`version_limit_reached`), a user can freeze 10 times an hour by default, a PDF
        holds 500 items at most by default (`pdf_too_large`) and the files of a version count against the storage of the workspace
        (`storage_limit_reached`). A workspace can ask for signatures 20 times a day by default, a version frozen with signers
        or a failed request sent again counting for one (`429` beyond, with `Retry-After`).
