                  maxLength: 120
                  description: What you call the version, on one line. None when absent, null or empty.
                signers:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: >-
                    The people to ask a signature from, at most 10 (the administrator of the instance can lower it). Their emails must
                    differ. Absent for a version nobody has to sign.
                  items:
                    $ref: '#/components/schemas/SignerInput'
