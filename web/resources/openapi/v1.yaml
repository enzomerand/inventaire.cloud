                      $ref: '#/components/schemas/TemplateSummary'
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the catalogue is reached.
  /templates/{slug}:
    parameters:
      - $ref: '#/components/parameters/TemplateSlug'
    get:
      tags:
        - Templates
      operationId: getTemplate
      summary: Get an inventory template
      description: >-
        One template with its description, the fields it would create and example rows, in the language of the request.
        No token is needed.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Template'
        '404':
          description: >-
            There is no such resource, or it belongs to a workspace the owner of the token is not a member of (the two are
            not told apart).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-codes:
            - code: template_not_found
              description: There is no template with this slug.
        '429':
          description: Too many requests. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
              example:
                message: Too many attempts. Please wait a moment before trying again.
                code: too_many_requests
          x-codes:
            - code: too_many_requests
              description: The rate limit of the catalogue is reached.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: inv_ personal access token
      description: >-
        A personal access token created from the account page of the web application. It starts with `inv_`.
  parameters:
    Page:
      name: page
      in: query
      description: The page to read, from 1.
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    WorkspaceId:
      name: workspace
      in: path
      required: true
      description: The id of the workspace.
      schema:
        $ref: '#/components/schemas/Ulid'
    InventoryId:
      name: inventory
      in: path
      required: true
      description: The id of the inventory.
      schema:
        $ref: '#/components/schemas/Ulid'
    FieldId:
      name: field
      in: path
      required: true
      description: The id of the field. It must belong to the inventory of the path.
      schema:
        $ref: '#/components/schemas/Ulid'
    ItemId:
      name: item
      in: path
      required: true
      description: The id of the item. It must belong to the inventory of the path.
      schema:
        $ref: '#/components/schemas/Ulid'
    AttachmentId:
      name: attachment
      in: path
      required: true
      description: The id of the attachment. It must belong to the item of the path.
      schema:
        $ref: '#/components/schemas/Ulid'
    ExportId:
      name: export
      in: path
      required: true
      description: The id of the export. Only the person who asked for it can see it.
      schema:
        $ref: '#/components/schemas/Ulid'
    ImportId:
      name: import
      in: path
      required: true
      description: The id of the import. Only the person who sent the file can see it.
      schema:
        $ref: '#/components/schemas/Ulid'
    VersionId:
      name: version
      in: path
      required: true
      description: The id of the official version. It must belong to the inventory of the path.
      schema:
        $ref: '#/components/schemas/Ulid'
    TemplateSlug:
      name: slug
      in: path
      required: true
      description: The slug of the template, as listed by `GET /templates`.
      schema:
        type: string
        maxLength: 60
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        examples:
          - wine-cellar
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: The language of the names and summaries (`fr` or `en`). The instance default applies without it.
      schema:
        type: string
        examples:
          - en
  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
    RateLimitLimit:
      description: Requests allowed in the window of the limit that was hit.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the window.
      schema:
        type: integer
    RateLimitReset:
      description: Unix timestamp at which the window ends.
      schema:
        type: integer
  responses:
    Unauthenticated:
      description: The token is missing, malformed, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    NotFound:
      description: >-
        There is no such resource, or it belongs to a workspace the owner of the token is not a member of (the two are
        not told apart).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Not Found
    ValidationFailed:
      description: The body or the query string is refused. `errors` names each fault under the key it is about.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The name field is required.
            errors:
              name:
                - The name field is required.
  schemas:
    Ulid:
      type: string
      description: The identifier of a resource, a lowercase ULID.
      pattern: ^[0-9a-z]{26}$
      examples:
        - 01k8gv2d9m3x5r7qn4p6t8w0ya
    Error:
      type: object
      description: The envelope of an error.
      required:
        - message
      properties:
        message:
          type: string
          description: What happened, for a person, in the language of the request. It may change.
        code:
          type: string
          description: Why, for a program. Not on every error, see `x-codes` of each operation.
    ValidationError:
      type: object
      description: A refused request (`422`).
      required:
        - message
        - errors
      properties:
        message:
          type: string
          description: The first message, with the number of other faults when there are more.
        errors:
          type: object
          description: The messages of each fault, by the key of the request they are about.
          additionalProperties:
            type: array
            items:
              type: string
        code:
          type: string
          description: A reason to switch on, for the faults that have one. See `x-codes` of the operation.
      additionalProperties: true
    CodedError:
      description: An error that always carries a `code` (`409`, `429`, `503`).
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - code
    ConflictError:
      description: A request refused for the state of the data or for a quota (`409`).
      allOf:
        - $ref: '#/components/schemas/CodedError'
        - type: object
          properties:
            limit:
              type: integer
              description: The quota that was reached, when the conflict is a quota.
    PaginationLinks:
      type: object
      description: The addresses of the pages. They keep the query parameters of the request.
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type:
            - string
            - 'null'
          format: uri
        last:
          type:
            - string
            - 'null'
          format: uri
        prev:
          type:
            - string
            - 'null'
          format: uri
          description: Null on the first page.
        next:
          type:
            - string
            - 'null'
          format: uri
          description: Null on the last page.
    PaginationMeta:
      type: object
      description: Where the page stands in the list.
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          type: integer
          minimum: 1
        from:
          type:
            - integer
            - 'null'
          description: The rank of the first entry of the page, null when the page is empty.
        to:
          type:
            - integer
            - 'null'
          description: The rank of the last entry of the page, null when the page is empty.
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: The number of entries in the whole list.
        path:
          type: string
          format: uri
          description: The address of the list, without the page.
        links:
          type: array
          description: The pager of the web application, ready to draw. Prefer `links` of the envelope.
          items:
            type: object
            required:
              - url
              - label
              - active
            properties:
              url:
                type:
                  - string
                  - 'null'
                format: uri
              label:
                type: string
              page:
                type:
                  - integer
                  - 'null'
              active:
                type: boolean
    Timestamp:
      type: string
      format: date-time
      description: A moment, ISO 8601 in UTC.
      examples:
        - '2026-10-15T12:30:00+00:00'
    User:
      type: object
      description: The user a token belongs to.
      required:
        - id
        - name
        - email
        - locale
        - is_admin
      properties:
        id:
          type: integer
          description: The number of the account. The only numeric key the API gives out.
        name:
          type: string
        email:
          type: string
          format: email
        locale:
          type:
            - string
            - 'null'
          description: The language the account follows (`fr`, `en`), null until it is known.
        is_admin:
          type: boolean
          description: Whether the user administers the instance.
    FieldType:
      type: object
      description: A type a field can have.
      required:
        - type
        - label
      properties:
        type:
          $ref: '#/components/schemas/FieldTypeKey'
        label:
          type: string
          description: The name of the type in the language of the request.
    FieldTypeKey:
      type: string
      description: The word that identifies a type of field.
      enum:
        - text
        - textarea
        - number
        - money
        - percentage
        - boolean
        - date
        - datetime
        - time
        - select
        - multiselect
        - tags
        - url
        - email
        - phone
        - rating
        - color
        - barcode
        - file
        - photo
    Role:
      type: string
      description: What a user may do in a workspace. Viewers read, editors also change items, fields and inventories, owners also delete inventories and manage the workspace.
      enum:
        - owner
        - editor
        - viewer
    Workspace:
      type: object
      description: A workspace, as seen by one of its members.
      required:
        - id
        - name
        - role
        - is_current
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'
        is_current:
          type: boolean
          description: Whether it is the workspace the user is working in in the web application.
        created_at:
          $ref: '#/components/schemas/Timestamp'
    InventoryAbilities:
      type: object
      description: What the user may do with the inventory, from their role in its workspace.
      required:
        - update
        - delete
        - manage_fields
        - edit_items
      properties:
        update:
          type: boolean
          description: Change the name and the description.
        delete:
          type: boolean
          description: Delete the inventory and everything in it.
        manage_fields:
          type: boolean
          description: Add, change, order and delete fields.
        edit_items:
          type: boolean
          description: Add, change and delete items, upload files, import.
    Inventory:
      type: object
      description: An inventory. `fields` is only given when a single inventory is read or changed.
      required:
        - id
        - workspace_id
        - name
        - description
        - fields_count
        - items_count
        - abilities
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        workspace_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        fields_count:
          type: integer
          minimum: 0
        items_count:
          type: integer
          minimum: 0
        fields:
          type: array
          description: The fields in order.
          items:
            $ref: '#/components/schemas/Field'
        abilities:
          $ref: '#/components/schemas/InventoryAbilities'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Choice:
      type: object
      description: A choice of a single or multiple choice field. Values hold the `id`, so a choice can be renamed without touching the items.
      required:
        - id
        - label
      properties: &choiceProperties
        id:
          type: string
          pattern: ^[a-z0-9]{8}$
          description: >-
            Made by the server and kept while the choice stays. When you send the choices of a field, give the `id` of
            the ones that already exist and leave it out for new ones: an id the field never had is replaced.
        label:
          type: string
          maxLength: 100
          description: One line. Two choices cannot have the same label (case and accents are ignored).
        color:
          type: string
          enum:
            - gray
            - red
            - orange
            - yellow
            - green
            - teal
            - blue
            - indigo
            - purple
            - pink
    ChoiceInput:
      type: object
      description: A choice of a single or multiple choice field as you send it, with no `id` for a new one.
      required:
        - label
      properties: *choiceProperties
    FieldOptions:
      type: object
      description: >-
        The options of a field, as answered. Which ones exist depends on its type; a type without options has an empty
        object. What you send is `FieldOptionsInput`.
      additionalProperties: false
      properties: &fieldOptionProperties
        max_length:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 1000
          description: '`text`: the longest value, in characters. 255 by default.'
        decimals:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 6
          description: >-
            `number`: the decimals a value may have (0 to 6, none by default). `percentage`: 0 to 4, 2 by default. For
            `money` it is given by the currency and cannot be sent.
        min:
          type:
            - string
            - number
            - 'null'
          description: '`number`: the smallest value, a decimal string.'
        max:
          type:
            - string
            - number
            - 'null'
          description: >-
            `number`: the largest value, a decimal string. `rating`: the top grade, an integer from 3 to 10 (5 by
            default).
        unit:
          type:
            - string
            - 'null'
          maxLength: 16
          description: '`number`: a unit shown next to the value, such as `kg`.'
        currency:
          type:
            - string
            - 'null'
          description: '`money`: an ISO 4217 code such as `EUR` (the default) or `USD`.'
        format:
          type:
            - string
            - 'null'
          enum:
            - any
            - ean13
            - ean8
            - upca
            - isbn10
            - isbn13
            - null
          description: '`barcode`: the code a value must be (`any`: up to 64 letters, digits, dashes and dots; the others check the check digit).'
        max_files:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 10
          description: '`file` and `photo`: how many files the field takes (1 by default).'
        choices:
          type:
            - array
            - 'null'
          maxItems: 200
          description: '`select` and `multiselect`: the choices, at least one. The list you send replaces the existing one.'
          items:
            $ref: '#/components/schemas/Choice'
    FieldOptionsInput:
      type: object
      description: >-
        The options you send for a field: the ones of `FieldOptions`, with the choices as `ChoiceInput`. Which ones exist
        depends on its type, and an option the type does not have is refused with `422`. When you change a field, the
        options you send are merged over the existing ones and an option sent as `null` goes back to its default.
      additionalProperties: false
      properties:
        <<: *fieldOptionProperties
        choices:
          type:
            - array
            - 'null'
          maxItems: 200
          description: '`select` and `multiselect`: the choices, at least one. The list you send replaces the existing one.'
          items:
            $ref: '#/components/schemas/ChoiceInput'
    Field:
      type: object
      description: A typed column of an inventory.
      required:
        - id
        - name
        - type
        - options
        - required
        - position
        - query_kind
        - summable
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          maxLength: 120
        type:
          type: string
          description: One of `FieldTypeKey`. It cannot be changed. A type this version does not know is given as stored.
          examples:
            - number
        options:
          $ref: '#/components/schemas/FieldOptions'
        required:
          type: boolean
          description: Whether an item must have a value for the field. Never true for `file` and `photo`.
        position:
          type: integer
          minimum: 0
          description: Where the field stands in the inventory, from 0.
        query_kind:
          type:
            - string
            - 'null'
          enum:
            - text
            - number
            - temporal
            - boolean
            - choice
            - choices
            - tags
            - files
            - null
          description: >-
            How the list of items sorts and filters the field. `text`, `number`, `temporal` (date, moment, time),
            `boolean` and `choice` can be sorted. Every kind can be filtered with `empty`; `number` and `temporal` also
            take `min` and `max`, `boolean` takes `is`, `choice` and `choices` take `in`. Null for a type this version
            does not know.
        summable:
          type: boolean
          description: Whether the totals of the list of items can add the values up (`number` and `money`).
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ItemValue:
      description: >-
        The value of one field. A string for text, long text, URL, email, phone, color, barcode, date, date and time,
        time and single choice; a decimal string for number, amount and percentage; a boolean for yes/no; an integer
        for rating; an array of strings for multiple choice, tags and the attachment ids of file and photo.
      oneOf:
        - type: string
        - type: boolean
        - type: integer
        - type: array
          items:
            type: string
    ItemValues:
      type: object
      description: The values of an item, keyed by the id of the field. A field without a value is absent.
      propertyNames:
        pattern: ^[0-9a-z]{26}$
      additionalProperties:
        $ref: '#/components/schemas/ItemValue'
    ItemValuesInput:
      type: object
      description: >-
        The values to write, keyed by the id of the field. A key that is not a field of the inventory, and a `file` or
        `photo` field, are refused. `null`, an empty text or an empty list clears a field (refused for a required one).
      propertyNames:
        pattern: ^[0-9a-zA-Z]{26}$
      additionalProperties:
        anyOf:
          - type: 'null'
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
    Item:
      type: object
      description: A row of an inventory.
      required:
        - id
        - values
        - attachments
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        values:
          $ref: '#/components/schemas/ItemValues'
        attachments:
          type: array
          description: Every file of the item, the ones of its file and photo fields included.
          items:
            $ref: '#/components/schemas/Attachment'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    FieldRef:
      type: object
      description: A field, as the history names it.
      required:
        - id
        - name
        - type
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        type:
          type: string
    RevisionChange:
      description: >-
        What changed. For `created` and `updated` it is one entry per field, with the values the way the item shows them
        now. For `attachment_added` and `attachment_removed` it is one entry naming the file.
      oneOf:
        - type: object
          title: Value change
          required:
            - field
            - before
            - after
          properties:
            field:
              $ref: '#/components/schemas/FieldRef'
            before:
              description: The value before, null when there was none.
              oneOf:
                - $ref: '#/components/schemas/ItemValue'
                - type: 'null'
            after:
              description: The value after, null when the field was cleared.
              oneOf:
                - $ref: '#/components/schemas/ItemValue'
                - type: 'null'
        - type: object
          title: File change
          required:
            - attachment
            - field
          properties:
            attachment:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  type:
                    - string
                    - 'null'
                name:
                  type:
                    - string
                    - 'null'
            field:
              description: The file or photo field the file belonged to, null for a plain attachment or if the field was deleted since.
              oneOf:
                - $ref: '#/components/schemas/FieldRef'
                - type: 'null'
    Revision:
      type: object
      description: One line of the history of an item.
      required:
        - id
        - action
        - user
        - created_at
        - changes
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        action:
          type: string
          enum:
            - created
            - updated
            - attachment_added
            - attachment_removed
        user:
          description: Who did it, null when their account was deleted since.
          oneOf:
            - type: object
              required:
                - name
              properties:
                name:
                  type: string
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/RevisionChange'
    Attachment:
      type: object
      description: A file attached to an item.
      required:
        - id
        - field
        - name
        - mime
        - size
        - width
        - height
        - has_thumbnail
        - uploaded_at
        - uploaded_by
        - url
        - thumbnail_url
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        field:
          description: The file or photo field the file fills, null for a plain attachment.
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        name:
          type: string
          maxLength: 255
        mime:
          type: string
          description: The type detected from the content when the file was uploaded.
        size:
          type: integer
          description: Bytes.
        width:
          type:
            - integer
            - 'null'
          description: Pixels, for an image.
        height:
          type:
            - integer
            - 'null'
          description: Pixels, for an image.
        has_thumbnail:
          type: boolean
        uploaded_at:
          $ref: '#/components/schemas/Timestamp'
        uploaded_by:
          description: Null when the account of the uploader was deleted since.
          oneOf:
            - type: object
              required:
                - name
              properties:
                name:
                  type: string
            - type: 'null'
        url:
          type: string
          description: The path of the file, relative to the host (it already starts with `/api/v1`). Call it with your token.
        thumbnail_url:
          type:
            - string
            - 'null'
          description: The path of the thumbnail, a JPEG. Null when the file has none.
    ExportFormat:
      type: string
      enum:
        - xlsx
        - ods
        - csv
        - json
        - pdf
        - zip
    ExportScope:
      type: string
      description: '`all`: every item. `view`: the items a list with the given `query` would show.'
      enum:
        - all
        - view
    ExportStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
    Export:
      type: object
      description: A file of the items of an inventory, written in the background for the person who asked.
      required:
        - id
        - format
        - scope
        - status
        - error
        - file_name
        - size
        - items_count
        - created_at
        - completed_at
        - expires_at
        - download_url
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        format:
          $ref: '#/components/schemas/ExportFormat'
        scope:
          $ref: '#/components/schemas/ExportScope'
        status:
          $ref: '#/components/schemas/ExportStatus'
        error:
          type:
            - string
            - 'null'
          description: For a failed export, what went wrong, in the language of the request. Null otherwise.
        file_name:
          type:
            - string
            - 'null'
          description: Null until the export is completed.
        size:
          type:
            - integer
            - 'null'
          description: Bytes. Null until the export is completed.
        items_count:
          type:
            - integer
            - 'null'
          description: The number of items in the file. Null until the export is completed.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the file is deleted (24 hours after the export ended by default). Null until it ends.
        download_url:
          type:
            - string
            - 'null'
          description: The path of the file, relative to the host. Null until the export is completed and after it expired.
    ImportStatus:
      type: string
      description: >-
        `uploaded`: the file was read and waits for you to start it. `pending`: started, waiting for a worker. `running`.
        `completed` or `failed`: the report is kept for 24 hours by default.
      enum:
        - uploaded
        - pending
        - running
        - completed
        - failed
    ImportOptions:
      type: object
      description: How the file is read and how its cells are understood.
      required:
        - has_header
        - delimiter
        - encoding
        - decimal
        - date_order
        - on_error
      properties:
        has_header:
          type: boolean
          description: Whether the first row holds the names of the columns.
        delimiter:
          type:
            - string
            - 'null'
          enum:
            - comma
            - semicolon
            - tab
            - null
          description: The separator of a text file. Null for a spreadsheet.
        encoding:
          type:
            - string
            - 'null'
          enum:
            - utf-8
            - windows-1252
            - utf-16
            - null
          description: The encoding of a text file. Null for a spreadsheet.
        decimal:
          type: string
          enum:
            - comma
            - point
          description: The decimal sign of the numbers in the file.
        date_order:
          type: string
          enum:
            - dmy
            - mdy
            - ymd
          description: The order of day, month and year in the dates written with digits.
        on_error:
          type: string
          enum:
            - abort
            - skip
          description: '`abort`: nothing is imported if a row is refused. `skip`: the rows that are refused are left out and reported.'
    ImportColumn:
      type: object
      description: A column of the file.
      required:
        - index
        - header
        - samples
        - guess
        - fraction_like
      properties:
        index:
          type: integer
          minimum: 0
          description: The position of the column, from 0.
        header:
          type: string
          description: The name of the column, or a letter when it has none.
        samples:
          type: array
          description: A few values of the column.
          items:
            type: string
        guess:
          $ref: '#/components/schemas/FieldTypeKey'
        fraction_like:
          type: boolean
          description: >-
            Whether the values are numbers between -1 and 1 that are not all whole, as a spreadsheet stores percentages
            (12.5 % is 0.125): check before mapping the column to a percentage field.
    ImportMappingEntry:
      type: object
      description: Where a column goes.
      required:
        - column
        - target
        - field
        - type
        - name
      properties:
        column:
          type: integer
          minimum: 0
          description: The `index` of the column.
        target:
          type: string
          enum:
            - ignore
            - field
            - new
          description: '`ignore`: the column is left out. `field`: it fills the existing field `field`. `new`: a field of type `type` called `name` is created for it (needs the right to change the fields).'
        field:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The id of the field, for the target `field`.
        type:
          oneOf:
            - $ref: '#/components/schemas/FieldTypeKey'
            - type: 'null'
          description: The type of the new field, for the target `new`. Not `file`, `photo` or `multiselect`.
        name:
          type:
            - string
            - 'null'
          description: The name of the new field, for the target `new`.
    ImportRowError:
      type: object
      description: A row that was refused.
      required:
        - row
        - column
        - message
      properties:
        row:
          type: integer
          description: The number of the row in the file.
        column:
          type:
            - string
            - 'null'
          description: The name of the column the fault is about, null when it is about the row.
        message:
          type: string
    Import:
      type: object
      description: >-
        A file brought into an inventory. It is read when sent (columns, a guess of their types and a proposed mapping),
        then you start it and a worker adds the items.
      required:
        - id
        - format
        - status
        - error
        - file_name
        - size
        - options
        - columns
        - mapping
        - rows_total
        - rows_imported
        - rows_failed
        - fields_created
        - errors
        - created_at
        - completed_at
        - expires_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        format:
          type: string
          enum:
            - csv
            - xlsx
            - ods
        status:
          $ref: '#/components/schemas/ImportStatus'
        error:
          type:
            - string
            - 'null'
          description: For a failed import, what went wrong, in the language of the request. Null otherwise.
        file_name:
          type: string
        size:
          type: integer
          description: Bytes.
        options:
          $ref: '#/components/schemas/ImportOptions'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ImportColumn'
        mapping:
          type: array
          description: The proposal while the import is `uploaded`, what was started afterwards.
          items:
            $ref: '#/components/schemas/ImportMappingEntry'
        rows_total:
          type:
            - integer
            - 'null'
          description: Rows with something in them. Null until the import ends.
        rows_imported:
          type:
            - integer
            - 'null'
          description: Null until the import ends.
        rows_failed:
          type:
            - integer
            - 'null'
          description: Null until the import ends.
        fields_created:
          type:
            - integer
            - 'null'
          description: Null until the import ends.
        errors:
          type:
            - array
            - 'null'
          description: The first 100 refused rows. Null until the import ends.
          items:
            $ref: '#/components/schemas/ImportRowError'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When the report, or a file that was sent and never started, is deleted. Null while the import is started and
            has not ended.
    VersionStatus:
      type: string
      description: >-
        Where the writing of the PDF is. `pending`: frozen, waiting for a worker. `running`. `completed`: the PDF and the data can be
        downloaded. `failed`: nothing was kept, the `error` says why, and the version can only be deleted.
      enum:
        - pending
        - running
        - completed
        - failed
    SignatureStatus:
      type: string
      description: >-
        Where the request for signatures is. `requested`: asked for, not sent to the signature service yet. `sending`. `awaiting`: the
        signers have their emails and not all have signed. `completed`: everybody signed and the signed PDF is stored. `rejected`:
        a signer refused. `cancelled`: cancelled here or at the signature service. `failed`: the request could not be sent or was lost,
        the `error` says why.
      enum:
        - requested
        - sending
        - awaiting
        - completed
        - rejected
        - cancelled
        - failed
    SignerStatus:
      type: string
      description: >-
        Where one signer is. `pending`: yet to sign. `signed`. `rejected`: refused to sign.
      enum:
        - pending
        - signed
        - rejected
    SignerInput:
      type: object
      description: A person to ask a signature from.
      required:
        - name
        - email
      properties:
        name:
          type: string
          description: The name, as it is shown on the page of signatures and in the email they get.
          examples:
            - Ada Lovelace
        email:
          type: string
          description: The email address the signature service writes to.
          examples:
            - ada@example.com
    Signer:
      type: object
      description: A person asked to sign a version, and what they did.
      required:
        - name
        - email
        - status
        - signed_at
        - rejection_reason
      properties:
        name:
          type: string
        email:
          type: string
        status:
          $ref: '#/components/schemas/SignerStatus'
        signed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When they signed. Null until they do.
        rejection_reason:
          type:
            - string
            - 'null'
          description: Why they refused to sign, when they said.
    InventoryVersion:
      type: object
      description: >-
        An inventory frozen at a date: numbered inventory by inventory, with the data that was frozen, the official PDF written from
        it and, when signatures were asked for, where they stand.
      required:
        - id
        - number
        - label
        - status
        - error
        - frozen_at
        - created_at
        - author
        - items_count
        - fields_count
        - snapshot
        - pdf
        - signature
        - abilities
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        number:
          type: integer
          minimum: 1
          description: 1 for the first version of the inventory, then 2, 3... A new version is numbered after the highest one that remains.
        label:
          type:
            - string
            - 'null'
          description: What the person who froze the inventory called the version.
        status:
          $ref: '#/components/schemas/VersionStatus'
        error:
          type:
            - string
            - 'null'
          description: For a failed version, what went wrong, in the language of the request. Null otherwise.
        frozen_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        author:
          type: object
          description: Who froze the inventory. The name is kept with the version when the account is deleted.
          required:
            - name
          properties:
            name:
              type: string
        items_count:
          type: integer
          description: The number of items that were frozen.
        fields_count:
          type: integer
          description: The number of fields that were frozen.
        snapshot:
          type: object
          description: The frozen data, a canonical JSON file. Everything else is written from it.
          required:
            - sha256
            - size
            - download_url
          properties:
            sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: The SHA-256 of the bytes of the file, in hexadecimal.
            size:
              type: integer
              description: Bytes.
            download_url:
              type:
                - string
                - 'null'
              description: >-
                The path of the file, relative to the host. Null until the version is completed (`status` is `completed`), as the
                download answers `409` (`version_not_ready`) before that.
        pdf:
          description: The official PDF. Null until the version is completed.
          oneOf:
            - type: object
              required:
                - sha256
                - size
                - pages
                - download_url
              properties:
                sha256:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                size:
                  type: integer
                  description: Bytes.
                pages:
                  type: integer
                  minimum: 1
                download_url:
                  type: string
                  description: The path of the file, relative to the host.
            - type: 'null'
        signature:
          description: The request for signatures. Null for a version nobody was asked to sign.
          oneOf:
            - type: object
              required:
                - status
                - error
                - requested_at
                - completed_at
                - signers
                - signed_pdf
              properties:
                status:
                  $ref: '#/components/schemas/SignatureStatus'
                error:
                  type:
                    - string
                    - 'null'
                  description: For a request that failed or was lost, what went wrong, in the language of the request. Null otherwise.
                requested_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: When the signature service sent the emails. Null until it did.
                completed_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: When the last signer signed and the signed PDF was stored. Null until then.
                signers:
                  type: array
                  items:
                    $ref: '#/components/schemas/Signer'
                signed_pdf:
                  description: The PDF with the signatures. Null until every signer has signed.
                  oneOf:
                    - type: object
                      required:
                        - sha256
                        - size
                        - download_url
                      properties:
                        sha256:
                          type: string
                          pattern: ^[0-9a-f]{64}$
                        size:
                          type: integer
                          description: Bytes.
                        download_url:
                          type: string
                          description: The path of the file, relative to the host.
                    - type: 'null'
            - type: 'null'
        abilities:
          type: object
          description: What the owner of the token may do with this version right now, with their role and the state of the version.
          required:
            - delete
            - cancel_signature
            - retry_signature
          properties:
            delete:
              type: boolean
              description: Owners of the workspace.
            cancel_signature:
              type: boolean
              description: Editors and owners, while the signers are awaited.
            retry_signature:
              type: boolean
              description: Editors and owners, for a completed version whose request for signatures failed.
    TemplateBase:
      type: object
      description: What a template is called and where to read about it. The list and the detail share it.
      required:
        - slug
        - category
        - category_label
        - icon
        - name
        - summary
        - url
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        category:
          type: string
          enum:
            - home
            - business
            - it
            - collection
            - hobby
            - food
            - association
        category_label:
          type: string
          description: The name of the category in the language of the request.
        icon:
          type: string
          description: The name of a Tabler icon.
        name:
          type: string
          description: The name of the inventory the template makes.
        summary:
          type: string
          description: One sentence.
        url:
          type: string
          format: uri
          description: The public page of the template, in the language of the request.
    TemplateSummary:
      description: A template, enough to draw a card.
      allOf:
        - $ref: '#/components/schemas/TemplateBase'
        - type: object
          required:
            - fields_count
          properties:
            fields_count:
              type: integer
              minimum: 0
    TemplateChoice:
      type: object
      description: A choice of a template field. The `key` is what the examples name it by; the ids are made when an inventory is created.
      required:
        - key
        - label
        - color
      properties:
        key:
          type: string
        label:
          type: string
        color:
          type:
            - string
            - 'null'
    TemplateField:
      type: object
      description: A field the template would create.
      required:
        - key
        - name
        - type
        - type_label
        - required
        - options
      properties:
        key:
          type: string
          pattern: ^[a-z0-9_]+$
          description: What the examples are keyed by.
        name:
          type: string
        type:
          $ref: '#/components/schemas/FieldTypeKey'
        type_label:
          type: string
          description: The name of the type in the language of the request.
        required:
          type: boolean
        options:
          type: object
          description: The options of the field as the template file gives them (see `FieldOptions` for what each one means); `choices` list `TemplateChoice`.
          properties:
            max_length:
              type: integer
            decimals:
              type: integer
            min:
              type:
                - string
                - number
            max:
              type:
                - string
                - number
            unit:
              type: string
            currency:
              type: string
            format:
              type: string
            max_files:
              type: integer
            choices:
              type: array
              items:
                $ref: '#/components/schemas/TemplateChoice'
    Template:
      description: A template with its description, its fields and its example rows.
      allOf:
        - $ref: '#/components/schemas/TemplateBase'
        - type: object
          required:
            - description
            - fields
            - examples
          properties:
            description:
              type: array
              description: The paragraphs of the description.
              items:
                type: string
            fields:
              type: array
              items:
                $ref: '#/components/schemas/TemplateField'
            examples:
              type: array
              description: Example rows, keyed by the `key` of the fields, with values written the way the API writes them. They are never stored in an inventory.
              items:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ItemValue'
