; Settings of the inventaire.cloud image. They are loaded after php.ini (a copy of
; php.ini-production: errors are logged, never displayed), so they win.

; Uploads (photos, attachments, imports): keep post_max_size >= upload_max_filesize.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M

expose_php = Off

; OPcache keeps compiled code in memory. Timestamps stay checked (every 2 seconds by
; default) on purpose: `inventaire:upgrade --optimize` rewrites bootstrap/cache/*.php
; inside the running container and the server must notice it.
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
